name: Bound Authority Version Maintenance

on:
  push:
    branches:
      - feature/genesis-v18-7-9-bound-authority

permissions:
  contents: write

jobs:
  update-version-expectations:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/genesis-v18-7-9-bound-authority
      - name: Advance primary-runtime compatibility expectations
        run: |
          python - <<'PY'
          from pathlib import Path

          paths = [
              Path("tests/test_genesis_v18_7_1.py"),
              Path("tests/test_genesis_v18_7_2.py"),
              Path("tests/test_genesis_v18_7_3.py"),
              Path("tests/test_genesis_v18_7_4.py"),
              Path("tests/test_genesis_v18_7_5.py"),
              Path("tests/test_genesis_v18_7_6.py"),
              Path("tests/test_genesis_v18_7_7.py"),
          ]
          for path in paths:
              text = path.read_text(encoding="utf-8")
              path.write_text(text.replace('"18.7.8"', '"18.7.9"'), encoding="utf-8")
          PY
      - name: Commit only when expectations changed
        run: |
          if git diff --quiet; then
            echo "No version expectation changes remain."
            exit 0
          fi
          git config user.name "janus-genesis-maintenance"
          git config user.email "actions@users.noreply.github.com"
          git add tests/test_genesis_v18_7_1.py tests/test_genesis_v18_7_2.py tests/test_genesis_v18_7_3.py tests/test_genesis_v18_7_4.py tests/test_genesis_v18_7_5.py tests/test_genesis_v18_7_6.py tests/test_genesis_v18_7_7.py
          git commit -m "Advance primary compatibility expectations to v18.7.9"
          git push origin HEAD:feature/genesis-v18-7-9-bound-authority
