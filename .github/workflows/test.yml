name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile janus_genesis.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Offline smoke
        run: python janus_genesis.py --data-dir .smoke --action "Помочь построить мост"
