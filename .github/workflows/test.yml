name: test

on:
  push:
  pull_request:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile
        run: >-
          python -m py_compile
          janus_genesis.py
          genesis_v18_models.py genesis_v18_memory.py genesis_v18.py genesis_v18_playable.py
          genesis_v18_1.py genesis_v18_1_playable.py
          genesis_v18_2.py genesis_v18_2_playable.py
          genesis_v18_3.py genesis_v18_3_playable.py
          genesis_v18_4.py genesis_v18_4_stories.py genesis_v18_4_playable.py
          genesis_v18_5_catalog.py genesis_v18_5.py genesis_v18_5_playable.py
          genesis_v18_6_catalog.py genesis_v18_6.py genesis_v18_6_lexicon.py genesis_v18_6_playable.py
          genesis_v18_7_catalog.py genesis_v18_7_compat.py genesis_v18_7.py
          genesis_v18_7_1.py genesis_v18_7_2.py genesis_v18_7_3.py genesis_v18_7_4.py
          genesis_v18_7_5.py genesis_v18_7_5_repair.py genesis_v18_7_6.py
          genesis_v18_7_7.py genesis_v18_7_7_voice_integrity.py genesis_v18_7_8.py
          genesis_v18_7_9.py genesis_v18_7_9_persistence.py genesis_v18_7_9_reactive_verifier.py
          genesis_v18_7_playable.py genesis_v18_7_1_playable.py genesis_v18_7_2_playable.py
          genesis_v18_7_auth.py genesis_v18_7_ai.py genesis_v18_7_network.py genesis_v18_7_portable.py
          tools/build_external_lexicon.py tools/genesis_api_server.py tools/genesis_network_hub.py
          play_genesis.py
      - name: Test
        id: unittest
        shell: bash
        run: |
          set +e
          python -m unittest discover -s tests -v > "unittest-${{ matrix.python-version }}.log" 2>&1
          code=$?
          cat "unittest-${{ matrix.python-version }}.log"
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit "$code"
      - name: Upload unittest log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unittest-log-python-${{ matrix.python-version }}
          path: unittest-${{ matrix.python-version }}.log
          if-no-files-found: error
          retention-days: 7
      - name: Offline smoke
        if: steps.unittest.outputs.exit_code == '0'
        run: |
          python play_genesis.py --data-dir .smoke --player smoke --action "помочь @visitor построить мост"
          python play_genesis.py --data-dir .smoke --player smoke --verify-possibility-graph
          python play_genesis.py --data-dir .smoke --player smoke --verify-free-others
          python play_genesis.py --data-dir .smoke --export-save smoke.genesis-save.json
          python play_genesis.py --data-dir .smoke-restored --import-save smoke.genesis-save.json
