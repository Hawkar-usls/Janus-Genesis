name: JANUS Hephaestus Crystal v2

on:
  pull_request:
    paths:
      - 'tools/janus_hephaestus_crystal.py'
      - 'tests/test_janus_hephaestus_crystal_v2.py'
      - 'protocol/JANUS_HEPHAESTUS_CRYSTAL-v2.0.json'
      - '.github/workflows/janus-hephaestus-crystal-v2.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hephaestus-crystal-v2:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile exact implementation and tests
        run: |
          python -m py_compile \
            tools/janus_hephaestus_crystal.py \
            tests/test_janus_hephaestus_crystal_v2.py

      - name: Validate contract JSON without duplicate keys
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('protocol/JANUS_HEPHAESTUS_CRYSTAL-v2.0.json')
          raw = path.read_text(encoding='utf-8')

          def no_duplicates(pairs):
              out = {}
              for key, value in pairs:
                  if key in out:
                      raise SystemExit(f'duplicate JSON key: {key}')
                  out[key] = value
              return out

          contract = json.loads(raw, object_pairs_hook=no_duplicates)
          assert contract['historical_lineage']['p_equals_np_proven'] is False
          assert contract['measurement_planes']['fragmentation']['measured_by_v2'] is False
          assert contract['scan_boundary']['file_content_read'] is False
          assert contract['scan_boundary']['defragmentation'] is False
          assert contract['privacy_boundary']['aggregate_report_contains_file_paths'] is False
          assert contract['quantum_claim_boundary']['historical_success_claim_retained'] is True
          assert contract['quantum_claim_boundary']['historical_success_claim_promoted_to_current_truth'] is False
          assert contract['claim_ceiling']['authority_delta'] == 0
          assert contract['claim_ceiling']['mass_effect_budget_delta'] == 0
          print('Hephaestus contract JSON: PASS')
          PY

      - name: Run adversarial unit tests
        run: |
          python -m unittest -v tests.test_janus_hephaestus_crystal_v2

      - name: Enforce historical-claim and measurement boundaries
        run: |
          grep -F 'SIZE_DISTRIBUTION_ENTROPY != FILESYSTEM_FRAGMENTATION' protocol/JANUS_HEPHAESTUS_CRYSTAL-v2.0.json
          grep -F 'SIMULATED_CONVERGENCE != COMPLEXITY_CLASS_PROOF' protocol/JANUS_HEPHAESTUS_CRYSTAL-v2.0.json
          grep -F 'HARDCODED_COUNTS != EXPERIMENTAL_EVIDENCE' protocol/JANUS_HEPHAESTUS_CRYSTAL-v2.0.json
          grep -F 'SQL_INSERT_SUCCESS != THEOREM_VERIFICATION' protocol/JANUS_HEPHAESTUS_CRYSTAL-v2.0.json
          grep -F 'LOWER_SEEK_ACTIVITY_HYPOTHESIS != HDD_LIFETIME_GUARANTEE' protocol/JANUS_HEPHAESTUS_CRYSTAL-v2.0.json

      - name: Static effect-surface canary
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path

          path = Path('tools/janus_hephaestus_crystal.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          forbidden_imports = {'socket','subprocess','requests','httpx','urllib','ftplib','paramiko','shutil'}
          forbidden_calls = {
              'open','os.open','os.remove','os.unlink','os.rename','os.replace','os.rmdir',
              'os.system','os.popen'
          }
          imports = set()
          calls = set()
          for node in ast.walk(tree):
              if isinstance(node, ast.Import):
                  imports.update(alias.name.split('.')[0] for alias in node.names)
              elif isinstance(node, ast.ImportFrom) and node.module:
                  imports.add(node.module.split('.')[0])
              elif isinstance(node, ast.Call):
                  fn = node.func
                  if isinstance(fn, ast.Name):
                      calls.add(fn.id)
                  elif isinstance(fn, ast.Attribute) and isinstance(fn.value, ast.Name):
                      calls.add(f'{fn.value.id}.{fn.attr}')
          bad_imports = imports & forbidden_imports
          bad_calls = calls & forbidden_calls
          if bad_imports or bad_calls:
              raise SystemExit(f'effect-surface expansion imports={bad_imports} calls={bad_calls}')
          print('Hephaestus static effect surface: PASS')
          PY
