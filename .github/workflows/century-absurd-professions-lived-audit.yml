name: Century Absurd Professions Lived Audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/century-of-absurd-professions-v18-7-10-20260728
    paths:
      - "experiments/century_of_absurd_professions_v18_7_10.py"
      - "tests/test_experiment_century_contract_v18_7_10.py"
      - ".github/workflows/century-absurd-professions-lived-audit.yml"
      - "genesis_v18_7*.py"

permissions:
  contents: read

jobs:
  lived-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade cryptography
      - name: Compile lived audit
        run: python -m py_compile experiments/century_of_absurd_professions_v18_7_10.py
      - name: Check lived-audit contract
        run: python -m unittest -v tests.test_experiment_century_contract_v18_7_10
      - name: Live 120 years
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p lived-artifacts
          python experiments/century_of_absurd_professions_v18_7_10.py \
            --output lived-artifacts \
            2>&1 | tee lived-artifacts/century-workflow.log
      - name: Seal artifact manifest
        run: |
          python - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path("lived-artifacts")
          rows = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              raw = path.read_bytes()
              rows.append({
                  "path": path.relative_to(root).as_posix(),
                  "size": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })
          material = json.dumps(rows, sort_keys=True, separators=(",", ":")).encode()
          manifest = {
              "schema": "janus.genesis.century_lived_artifact_manifest.v1",
              "files": rows,
              "manifest_sha256": hashlib.sha256(material).hexdigest(),
          }
          (root / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          print(manifest["manifest_sha256"])
          PY
      - name: Upload lived evidence
        uses: actions/upload-artifact@v4
        with:
          name: century-absurd-professions-v18.7.10-lived-record
          path: lived-artifacts/
          if-no-files-found: error
          retention-days: 7
