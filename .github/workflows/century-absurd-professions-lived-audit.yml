name: Century Absurd Professions Lived Audit

on:
  workflow_dispatch:
  push:
    branches:
      - experiment/century-of-absurd-professions-v18-7-10-20260728
    paths:
      - "experiments/century_of_absurd_professions_v18_7_10.py"
      - "experiments/century_of_absurd_professions_v18_7_10_final.py"
      - "experiments/century_of_absurd_professions_v18_7_10_replay.py"
      - "tests/test_experiment_century_contract_v18_7_10.py"
      - ".github/workflows/century-absurd-professions-lived-audit.yml"
      - "genesis_v18_7*.py"

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  lived-audit:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --upgrade cryptography
      - name: Compile lived audit
        run: |
          python -m py_compile experiments/century_of_absurd_professions_v18_7_10.py
          python -m py_compile experiments/century_of_absurd_professions_v18_7_10_final.py
          python -m py_compile experiments/century_of_absurd_professions_v18_7_10_replay.py
      - name: Check lived-audit contract
        run: python -m unittest -v tests.test_experiment_century_contract_v18_7_10
      - name: Replay 120 years on repaired canonical runtime
        env:
          PYTHONPATH: .
        run: |
          set -o pipefail
          mkdir -p lived-artifacts
          python experiments/century_of_absurd_professions_v18_7_10_replay.py \
            --output lived-artifacts \
            2>&1 | tee lived-artifacts/century-workflow.log
      - name: Seal artifact manifest
        id: seal
        run: |
          python - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          root = Path("lived-artifacts")
          rows = []
          for path in sorted(p for p in root.rglob("*") if p.is_file()):
              raw = path.read_bytes()
              rows.append({
                  "path": path.relative_to(root).as_posix(),
                  "size": len(raw),
                  "sha256": hashlib.sha256(raw).hexdigest(),
              })
          material = json.dumps(rows, sort_keys=True, separators=(",", ":")).encode()
          manifest = {
              "schema": "janus.genesis.century_repaired_replay_manifest.v1",
              "repair_merge": "61fcd5a2c162d36a535c7cb0a7b1c7f962f3ea0a",
              "files": rows,
              "manifest_sha256": hashlib.sha256(material).hexdigest(),
          }
          (root / "artifact-manifest.json").write_text(
              json.dumps(manifest, indent=2, sort_keys=True) + "\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"manifest_sha256={manifest['manifest_sha256']}\n")
          print(manifest["manifest_sha256"])
          PY
      - name: Upload repaired lived evidence
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: century-absurd-professions-v18.7.10-repaired-replay
          path: lived-artifacts/
          if-no-files-found: error
          retention-days: 7
      - name: Publish repaired replay receipt to PR
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_DIGEST: ${{ steps.upload.outputs.artifact-digest }}
          MANIFEST_SHA256: ${{ steps.seal.outputs.manifest_sha256 }}
        run: |
          body=$(cat <<EOF
          ## Century repaired replay evidence receipt

          - canonical repair merge: \`61fcd5a2c162d36a535c7cb0a7b1c7f962f3ea0a\`
          - workflow run: \`${RUN_ID}\`
          - run attempt: \`${RUN_ATTEMPT}\`
          - artifact ID: \`${ARTIFACT_ID}\`
          - artifact digest: \`${ARTIFACT_DIGEST}\`
          - internal manifest SHA-256: \`${MANIFEST_SHA256}\`
          - artifact: ${ARTIFACT_URL}
          - original failed harness run preserved: \`30387905035\`
          - first pre-repair sealed life preserved: \`30388424828\`

          This receipt is emitted only after the identical 120-year life passes the repaired stable-voice contract, verifies a COMPLETE proofpack, and exports a final portable save containing the completed audit state.
          EOF
          )
          gh api repos/${{ github.repository }}/issues/47/comments -f body="$body"
      - name: Publish failed repaired-replay receipt to PR
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
          RUN_ATTEMPT: ${{ github.run_attempt }}
        run: |
          body=$(cat <<EOF
          ## Century repaired replay stopped before sealing

          - workflow run: \`${RUN_ID}\`
          - run attempt: \`${RUN_ATTEMPT}\`
          - canonical repair merge: \`61fcd5a2c162d36a535c7cb0a7b1c7f962f3ea0a\`

          The repaired replay did not receive a success seal. No final century result should be claimed from this run.
          EOF
          )
          gh api repos/${{ github.repository }}/issues/47/comments -f body="$body"
