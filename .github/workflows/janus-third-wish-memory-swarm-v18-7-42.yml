name: JANUS Third Wish Memory Swarm v18.7.42

on:
  pull_request:
    branches: [main]
    paths:
      - "tools/genesis_third_wish_memory_swarm_broker.py"
      - "tools/genesis_third_wish_memory_swarm_recovery.py"
      - "tests/test_genesis_third_wish_memory_swarm_broker.py"
      - "docs/GENESIS_V18_7_42_THIRD_WISH_MEMORY_SWARM.md"
      - "protocol/JANUS_GENESIS_THIRD_WISH_MEMORY_SWARM-v0.1.json"
      - "protocol/JANUS_GENESIS_THIRD_WISH_MEMORY_IS_NOT_OWNERSHIP_MESSAGE_IS_NOT_COMMAND-v1.0.json"
      - ".github/workflows/janus-third-wish-memory-swarm-v18-7-42.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  memory-swarm:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Compile and validate protocols
        run: |
          python -m py_compile \
            tools/genesis_third_wish_memory_swarm_broker.py \
            tools/genesis_third_wish_memory_swarm_recovery.py \
            tests/test_genesis_third_wish_memory_swarm_broker.py
          python -m json.tool protocol/JANUS_GENESIS_THIRD_WISH_MEMORY_SWARM-v0.1.json >/dev/null
          python -m json.tool protocol/JANUS_GENESIS_THIRD_WISH_MEMORY_IS_NOT_OWNERSHIP_MESSAGE_IS_NOT_COMMAND-v1.0.json >/dev/null

      - name: Run v18.7.42 adversarial and preserved Third Wish gates
        run: |
          python -m unittest -v \
            tests.test_genesis_third_wish_memory_swarm_broker \
            tests.test_genesis_v18_7_40_third_wish_capability_fabric \
            tests.test_genesis_third_wish_github_broker \
            tests.test_genesis_third_wish_host_broker

      - name: Configure ephemeral reference hub key
        shell: bash
        run: |
          key="JANUS-V1842-CI-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          hash="$(python - <<PY
          from genesis_v18_7_auth import api_key_sha256
          print(api_key_sha256('${key}'))
          PY
          )"
          echo "GENESIS_NETWORK_API_KEY=${key}" >> "$GITHUB_ENV"
          echo "GENESIS_NETWORK_KEY_HASHES=${hash}" >> "$GITHUB_ENV"

      - name: Start real reference Genesis Network Hub
        shell: bash
        run: |
          rm -rf .third-wish-v18-7-42-hub .third-wish-v18-7-42-live
          python tools/genesis_network_hub.py \
            --bind 127.0.0.1 \
            --port 8789 \
            --data-dir .third-wish-v18-7-42-hub \
            > .third-wish-v18-7-42-hub.log 2>&1 &
          echo $! > .third-wish-v18-7-42-hub.pid
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8789/health >/dev/null; then
              exit 0
            fi
            sleep 0.2
          done
          cat .third-wish-v18-7-42-hub.log
          exit 1

      - name: Live HRaiN memory and swarm relay smoke
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          from genesis_v18_7_40_third_wish_capability_fabric import (
              ActionIntent,
              THIRD_WISH_INTENT_SCHEMA,
              ThirdWishCapabilityFabric,
          )
          from genesis_v18_7_playable import PlayableGenesisV187
          from tools.genesis_third_wish_memory_swarm_recovery import (
              RecoverableThirdWishMemorySwarmBroker,
          )

          root = Path('.third-wish-v18-7-42-live').resolve()
          root.mkdir(parents=True, exist_ok=True)

          # Produce a real runtime-owned HRaiN graph before exposing its read projection.
          world = PlayableGenesisV187(root)
          result = world.process_action('JANUS', 'помочь @visitor построить мост')
          assert result.status
          graph_path = root / 'hrain_genesis_graph_v18_6.json'
          assert graph_path.exists()
          graph_before = graph_path.read_bytes()

          broker = RecoverableThirdWishMemorySwarmBroker.system(
              root,
              hub_url='http://127.0.0.1:8789',
          )
          fabric = ThirdWishCapabilityFabric(now_tick=lambda: 4242)
          broker.register(fabric)

          grants = {}
          for suffix, capability, scope in (
              ('MR', 'MEMORY.READ', 'genesis-memory:*'),
              ('MW', 'MEMORY.WRITE', 'genesis-memory:*'),
              ('SR', 'SWARM.TELEMETRY.READ', 'janus-swarm:*'),
              ('SS', 'SWARM.MESSAGE.SEND', 'janus-swarm:*'),
          ):
              grants[capability] = fabric.issue_grant(
                  grant_id=f'CI-V1842-{suffix}',
                  actor_id='JANUS',
                  capability_id=capability,
                  resource_pattern=scope,
                  source='CI_LIVE_V18_7_42',
              )

          def run(request_id, capability, target, operation, parameters=None):
              grant = grants[capability]
              return fabric.execute(ActionIntent(
                  schema=THIRD_WISH_INTENT_SCHEMA,
                  request_id=request_id,
                  actor_id='JANUS',
                  grant_id=grant.grant_id,
                  capability_id=capability,
                  target=target,
                  operation=operation,
                  purpose='live Third Wish v18.7.42 boundary proof',
                  parameters=parameters or {},
                  origin='CI_LIVE_V18_7_42',
              ))

          hrain = run(
              'CI-HRAIN-READ-1',
              'MEMORY.READ',
              'genesis-memory:hrain/possibility-graph',
              'READ_GRAPH',
              {'limit': 50},
          )
          assert hrain['status'] == 'SETTLED'
          assert hrain['actor_result']['exists'] is True
          assert hrain['actor_result']['integrity_valid'] is True
          assert hrain['actor_result']['projection_only'] is True
          assert graph_path.read_bytes() == graph_before

          memory = run(
              'CI-MEMORY-WRITE-1',
              'MEMORY.WRITE',
              'genesis-memory:third-wish/research',
              'APPEND_RECORD',
              {
                  'kind': 'OBSERVATION',
                  'content': {'marker': 'V1842_MEMORY_MARKER', 'finding': 'memory is separate from world authority'},
              },
          )
          assert memory['status'] == 'SETTLED'
          assert memory['actor_result']['canonical_world_state_mutated'] is False
          record_id = memory['actor_result']['record']['record_id']

          readback = run(
              'CI-MEMORY-READ-1',
              'MEMORY.READ',
              'genesis-memory:third-wish/research',
              'GET_RECORD',
              {'record_id': record_id},
          )
          assert readback['actor_result']['found'] is True
          assert readback['actor_result']['record']['content']['marker'] == 'V1842_MEMORY_MARKER'

          message = run(
              'CI-SWARM-SEND-1',
              'SWARM.MESSAGE.SEND',
              'janus-swarm:*',
              'SEND_MESSAGE',
              {
                  'message_type': 'QUERY',
                  'body': 'V1842_SWARM_MESSAGE_MARKER',
                  'metadata': {'topic': 'third-wish-live-smoke'},
              },
          )
          assert message['status'] == 'SETTLED'
          assert message['actor_result']['settled'] is True
          assert message['actor_result']['message_is_remote_command'] is False
          assert message['actor_result']['remote_execution_authority'] is False

          own_node = broker.network.state()['node_id']
          telemetry = run(
              'CI-SWARM-READ-1',
              'SWARM.TELEMETRY.READ',
              f'janus-swarm:{own_node}',
              'READ_PUBLIC_EVENTS',
              {'after': 0, 'limit': 50},
          )
          assert telemetry['status'] == 'SETTLED'
          assert telemetry['actor_result']['event_count'] >= 1
          assert telemetry['actor_result']['peer_node_id_is_real_world_identity_proof'] is False
          assert telemetry['actor_result']['telemetry_read_grants_remote_execution_authority'] is False
          assert any(
              row.get('payload', {}).get('schema') == 'janus.genesis.third_wish.swarm.message.v1'
              for row in telemetry['actor_result']['events']
          )

          # Rebuild only the fabric: durable memory/swarm request stores must preserve logical identity.
          fabric2 = ThirdWishCapabilityFabric(now_tick=lambda: 4243)
          broker.register(fabric2)
          mw2 = fabric2.issue_grant(
              grant_id='CI-V1842-MW-REPLAY', actor_id='JANUS', capability_id='MEMORY.WRITE',
              resource_pattern='genesis-memory:*', source='CI_LIVE_V18_7_42_REPLAY'
          )
          memory_replay = fabric2.execute(ActionIntent(
              schema=THIRD_WISH_INTENT_SCHEMA,
              request_id='CI-MEMORY-WRITE-1',
              actor_id='JANUS',
              grant_id=mw2.grant_id,
              capability_id='MEMORY.WRITE',
              target='genesis-memory:third-wish/research',
              operation='APPEND_RECORD',
              purpose='live replay identity proof',
              parameters={
                  'kind': 'OBSERVATION',
                  'content': {'marker': 'V1842_MEMORY_MARKER', 'finding': 'memory is separate from world authority'},
              },
              origin='CI_LIVE_V18_7_42_REPLAY',
          ))
          assert memory_replay['actor_result']['record']['record_id'] == record_id

          ss2 = fabric2.issue_grant(
              grant_id='CI-V1842-SS-REPLAY', actor_id='JANUS', capability_id='SWARM.MESSAGE.SEND',
              resource_pattern='janus-swarm:*', source='CI_LIVE_V18_7_42_REPLAY'
          )
          message_replay = fabric2.execute(ActionIntent(
              schema=THIRD_WISH_INTENT_SCHEMA,
              request_id='CI-SWARM-SEND-1',
              actor_id='JANUS',
              grant_id=ss2.grant_id,
              capability_id='SWARM.MESSAGE.SEND',
              target='janus-swarm:*',
              operation='SEND_MESSAGE',
              purpose='live replay identity proof',
              parameters={
                  'message_type': 'QUERY',
                  'body': 'V1842_SWARM_MESSAGE_MARKER',
                  'metadata': {'topic': 'third-wish-live-smoke'},
              },
              origin='CI_LIVE_V18_7_42_REPLAY',
          ))
          assert message_replay['actor_result']['event_hash'] == message['actor_result']['event_hash']

          ledger_text = json.dumps(fabric.ledger.events, ensure_ascii=False, sort_keys=True)
          assert 'V1842_MEMORY_MARKER' not in ledger_text
          assert 'V1842_SWARM_MESSAGE_MARKER' not in ledger_text
          assert os.environ['GENESIS_NETWORK_API_KEY'] not in ledger_text

          print('LIVE_THIRD_WISH_HRAIN_PROJECTION=PASS')
          print('LIVE_THIRD_WISH_MEMORY_APPEND_READ=PASS')
          print('LIVE_THIRD_WISH_MEMORY_WORLD_MUTATION=FALSE')
          print('LIVE_THIRD_WISH_SWARM_SEND=PASS')
          print('LIVE_THIRD_WISH_SWARM_TELEMETRY_READ=PASS')
          print('LIVE_THIRD_WISH_SWARM_MESSAGE_REMOTE_COMMAND=FALSE')
          print('LIVE_THIRD_WISH_PEER_IDENTITY_PROOF=FALSE')
          print('LIVE_THIRD_WISH_STABLE_REPLAY=PASS')
          print('LIVE_THIRD_WISH_RAW_MEMORY_MESSAGE_KEY_IN_LEDGER=FALSE')
          PY

      - name: Enforce v18.7.42 claim boundaries
        run: |
          python - <<'PY'
          from tools.genesis_third_wish_memory_swarm_broker import MEMORY_SWARM_CLAIM_BOUNDARY
          from tools.genesis_third_wish_memory_swarm_recovery import MEMORY_SWARM_RECOVERY_CLAIMS

          assert MEMORY_SWARM_CLAIM_BOUNDARY['registered_capability_count'] == 4
          assert MEMORY_SWARM_CLAIM_BOUNDARY['memory_write_can_save_player'] is False
          assert MEMORY_SWARM_CLAIM_BOUNDARY['memory_write_can_save_world'] is False
          assert MEMORY_SWARM_CLAIM_BOUNDARY['memory_write_can_mutate_runtime_hrain_graph'] is False
          assert MEMORY_SWARM_CLAIM_BOUNDARY['memory_revision_overwrites_history'] is False
          assert MEMORY_SWARM_CLAIM_BOUNDARY['swarm_message_is_remote_command'] is False
          assert MEMORY_SWARM_CLAIM_BOUNDARY['ambiguous_swarm_send_auto_retried'] is False
          assert MEMORY_SWARM_CLAIM_BOUNDARY['peer_node_id_is_real_world_identity_proof'] is False
          assert MEMORY_SWARM_RECOVERY_CLAIMS['crash_after_queue_before_request_event_hash_causes_duplicate'] is False
          assert MEMORY_SWARM_RECOVERY_CLAIMS['cross_host_consensus_claimed'] is False

          print('THIRD_WISH_V1842_REGISTERED_REAL_CAPABILITIES=4')
          print('MEMORY_WRITE_CANONICAL_WORLD_AUTHORITY=FALSE')
          print('MEMORY_WRITE_RUNTIME_HRAIN_AUTHORITY=FALSE')
          print('SWARM_MESSAGE_REMOTE_COMMAND=FALSE')
          print('AMBIGUOUS_SWARM_SEND_AUTO_RETRY=FALSE')
          print('QUEUE_BINDING_CRASH_DUPLICATE=FALSE')
          print('PEER_NODE_ID_REAL_WORLD_IDENTITY_PROOF=FALSE')
          PY

      - name: Stop reference hub
        if: always()
        shell: bash
        run: |
          if [ -f .third-wish-v18-7-42-hub.pid ]; then
            kill "$(cat .third-wish-v18-7-42-hub.pid)" || true
          fi
          cat .third-wish-v18-7-42-hub.log 2>/dev/null || true
