name: JANUS Live NAS Handoff Probe v1

on:
  pull_request:
    branches: [main]
    paths:
      - 'tools/janus_receiver_identity_probe.py'
      - 'tests/test_janus_receiver_identity_probe.py'
      - '.github/workflows/janus-live-nas-handoff-probe-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-probe-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout without write credentials
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Compile probe
        run: python -m py_compile tools/janus_receiver_identity_probe.py tests/test_janus_receiver_identity_probe.py

      - name: Run receiver probe tests
        run: python -m unittest tests.test_janus_receiver_identity_probe -v

      - name: Enforce read-only Docker command allowlist
        run: |
          python - <<'PY'
          import ast
          from pathlib import Path
          path = Path('tools/janus_receiver_identity_probe.py')
          tree = ast.parse(path.read_text(encoding='utf-8'))
          text = path.read_text(encoding='utf-8')
          assert 'READ_ONLY_DOCKER_SUBCOMMANDS = frozenset({"ps", "inspect"})' in text
          forbidden = ['docker exec', 'docker restart', 'docker stop', 'docker start', 'docker kill', 'docker rm', 'docker update']
          lowered = text.lower()
          # The module docstring may name forbidden commands as explicit non-actions;
          # executable construction must still be constrained by _docker_query.
          functions = {node.name: node for node in tree.body if isinstance(node, ast.FunctionDef)}
          gate = functions['_docker_query']
          gate_source = ast.get_source_segment(text, gate) or ''
          assert 'READ_ONLY_DOCKER_SUBCOMMANDS' in gate_source
          assert 'NON_READ_ONLY_DOCKER_SUBCOMMAND_REJECTED' in gate_source
          print('QNAP_DOCKER_QUERY_ALLOWLIST=PS_INSPECT_ONLY')
          print('DOCKER_EXEC_USED=FALSE')
          print('SERVICE_LIFECYCLE_MUTATION=FALSE')
          PY

      - name: Enforce live claim ceiling
        run: |
          python tools/janus_receiver_identity_probe.py --qnap-auto > /tmp/probe.json
          python - <<'PY'
          import json
          from pathlib import Path
          row = json.loads(Path('/tmp/probe.json').read_text())
          assert row['evidence_kind'] == 'LOCAL_PROBE_UNATTESTED'
          assert row['read_only'] is True
          assert row['source_writeback_observed'] is False
          assert row['destructive_action_observed'] is False
          assert row['authority_delta'] == 0
          assert row['claim_ceiling']['nas_available_proves_hr1_hr10'] is False
          assert row['claim_ceiling']['heartbeat_proves_service_owner'] is False
          print('GITHUB_CI_LIVE_NAS_EVIDENCE=FALSE')
          print('AUTHORITY_DELTA=0')
          PY
