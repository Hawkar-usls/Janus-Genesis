name: Threshold review precision

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile review precision layer
        run: |
          python -m py_compile \
            genesis_v18_7_18_threshold_discernment_guard.py \
            genesis_v18_7_18_threshold_guard_review_precision.py \
            genesis_v18_7_playable.py \
            scripts/run_threshold_guard_review_precision_audit.py
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v
      - name: Run review precision lived audit
        env:
          AUDIT_COMMIT: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          COMMIT="${AUDIT_COMMIT:-$GITHUB_SHA}"
          python scripts/run_threshold_guard_review_precision_audit.py \
            --output-dir artifacts/threshold-guard-review-precision-audit \
            --git-commit "$COMMIT"
      - name: Upload review precision proofpack
        uses: actions/upload-artifact@v4
        with:
          name: genesis-threshold-guard-review-precision-audit
          path: artifacts/threshold-guard-review-precision-audit
          if-no-files-found: error
          retention-days: 30
