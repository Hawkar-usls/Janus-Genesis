name: Genesis Generative Kernel Pages

on:
  pull_request:
    paths:
      - '.janus/GENESIS_LAWS_V1.json'
      - '.janus/GENESIS_KERNEL_ROADMAP_V1.json'
      - '.janus/GENESIS_WORLD_SHELL_R0.json'
      - '.janus/GENESIS_ACTION_FORGE_R0.json'
      - '.janus/GENESIS_FULL_RUNTIME_V1.json'
      - '.janus/GENESIS_COMMAND_RUNTIME_R0_3.json'
      - '.janus/GENESIS_SCENE_INTENT_GRAPH_R0_4.json'
      - '.janus/GENESIS_PAROGRAD_KRIEGER_R0_5.json'
      - '.janus/GENESIS_PROVIDER_FALLBACK_R0_5_1.json'
      - '.janus/GENESIS_BIRTH_R0_6.json'
      - '.janus/GENESIS_PLAYER_MIRROR_R0_7.json'
      - 'contracts/**'
      - 'GENESIS_PAGES_RELEASE.json'
      - 'genesis-audio-forge.js'
      - 'index.html'
      - 'kernel-lab.html'
      - 'site/**'
      - 'asset_sources/**'
      - 'tests/test_genesis_pages_contracts.py'
      - 'tests/test_genesis_world_shell.py'
      - 'tests/test_genesis_action_forge.py'
      - 'tests/test_genesis_full_runtime_v1.py'
      - 'tests/test_genesis_command_runtime_r0_3.py'
      - 'tests/test_genesis_scene_intent_graph_r0_4.py'
      - 'tests/test_genesis_parograd_krieger_r0_5.py'
      - 'tests/test_genesis_provider_fallback_r0_5_1.py'
      - 'tests/test_genesis_birth_r0_6.py'
      - 'tests/test_genesis_player_mirror_r0_7.py'
      - '.github/workflows/genesis-pages.yml'
  push:
    branches: [main]
    paths:
      - '.janus/GENESIS_LAWS_V1.json'
      - '.janus/GENESIS_KERNEL_ROADMAP_V1.json'
      - '.janus/GENESIS_WORLD_SHELL_R0.json'
      - '.janus/GENESIS_ACTION_FORGE_R0.json'
      - '.janus/GENESIS_FULL_RUNTIME_V1.json'
      - '.janus/GENESIS_COMMAND_RUNTIME_R0_3.json'
      - '.janus/GENESIS_SCENE_INTENT_GRAPH_R0_4.json'
      - '.janus/GENESIS_PAROGRAD_KRIEGER_R0_5.json'
      - '.janus/GENESIS_PROVIDER_FALLBACK_R0_5_1.json'
      - '.janus/GENESIS_BIRTH_R0_6.json'
      - '.janus/GENESIS_PLAYER_MIRROR_R0_7.json'
      - 'contracts/**'
      - 'GENESIS_PAGES_RELEASE.json'
      - 'genesis-audio-forge.js'
      - 'index.html'
      - 'kernel-lab.html'
      - 'site/**'
      - 'asset_sources/**'
      - 'tests/test_genesis_pages_contracts.py'
      - 'tests/test_genesis_world_shell.py'
      - 'tests/test_genesis_action_forge.py'
      - 'tests/test_genesis_full_runtime_v1.py'
      - 'tests/test_genesis_command_runtime_r0_3.py'
      - 'tests/test_genesis_scene_intent_graph_r0_4.py'
      - 'tests/test_genesis_parograd_krieger_r0_5.py'
      - 'tests/test_genesis_provider_fallback_r0_5_1.py'
      - 'tests/test_genesis_birth_r0_6.py'
      - 'tests/test_genesis_player_mirror_r0_7.py'
      - '.github/workflows/genesis-pages.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: genesis-pages-verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate branch Pages runtime
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate frozen contracts and active runtime overlays
        run: |
          set -euo pipefail
          python -m unittest tests.test_genesis_pages_contracts -v
          python -m unittest tests.test_genesis_world_shell -v
          python -m unittest tests.test_genesis_action_forge -v
          python -m unittest tests.test_genesis_full_runtime_v1 -v
          python -m unittest tests.test_genesis_command_runtime_r0_3 -v
          python -m unittest tests.test_genesis_scene_intent_graph_r0_4 -v
          python -m unittest tests.test_genesis_parograd_krieger_r0_5 -v
          python -m unittest tests.test_genesis_provider_fallback_r0_5_1 -v
          python -m unittest tests.test_genesis_birth_r0_6 -v
          python -m unittest tests.test_genesis_player_mirror_r0_7 -v
          python -m json.tool GENESIS_PAGES_RELEASE.json >/dev/null
          python -m json.tool .janus/GENESIS_PAROGRAD_KRIEGER_R0_5.json >/dev/null
          python -m json.tool .janus/GENESIS_PROVIDER_FALLBACK_R0_5_1.json >/dev/null
          python -m json.tool .janus/GENESIS_BIRTH_R0_6.json >/dev/null
          python -m json.tool .janus/GENESIS_PLAYER_MIRROR_R0_7.json >/dev/null
          python -m json.tool contracts/GENESIS_BIRTH_R0_6.json >/dev/null
          python -m json.tool contracts/GENESIS_PLAYER_MIRROR_R0_7.json >/dev/null
          python -m json.tool asset_sources/ASSET_SOURCE_REGISTRY_R0_5.json >/dev/null
          python -m json.tool asset_sources/MECHANIC_RECIPE_SOURCE_REGISTRY_R0_5.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          witness=json.loads(Path('GENESIS_PAGES_RELEASE.json').read_text(encoding='utf-8'))
          assert witness['deployment_authority']=='GITHUB_PAGES_BRANCH_SOURCE'
          assert witness['custom_workflow_role']=='VALIDATE_PACKAGE_AND_VERIFY_ONLY'
          assert witness['release_id'].startswith('GENESIS-PAGES-R0.7-PLAYER-MIRROR-')
          assert witness['birth_contract']=='contracts/GENESIS_BIRTH_R0_6.json'
          assert witness['player_mirror_contract']=='contracts/GENESIS_PLAYER_MIRROR_R0_7.json'
          names=(
              'GENESIS_COMMAND_RUNTIME_R0_3.json',
              'GENESIS_SCENE_INTENT_GRAPH_R0_4.json',
              'GENESIS_PAROGRAD_KRIEGER_R0_5.json',
              'GENESIS_PROVIDER_FALLBACK_R0_5_1.json',
              'GENESIS_BIRTH_R0_6.json',
              'GENESIS_PLAYER_MIRROR_R0_7.json',
          )
          for name in names:
              canonical=json.loads((Path('.janus')/name).read_text(encoding='utf-8'))
              public=json.loads((Path('contracts')/name).read_text(encoding='utf-8'))
              assert canonical == public, f'contract mirror drift: {name}'
          PY

      - name: Validate active browser runtime lineage
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path, PurePosixPath

          class Refs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.scripts=[]; self.styles=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('src'): self.scripts.append(a['src'])
                  if tag=='link' and a.get('href') and a.get('rel','').lower()=='stylesheet': self.styles.append(a['href'])

          def parse(path):
              p=Refs(); p.feed(Path(path).read_text(encoding='utf-8')); return p
          def local(ref):
              return ref and not ref.startswith(('http://','https://','//','data:','#'))
          def basename(ref):
              clean=ref.split('?',1)[0].split('#',1)[0]
              return PurePosixPath(clean).name

          site=parse('site/index.html')
          root=parse('index.html')
          site_scripts=[basename(x) for x in site.scripts if local(x)]
          root_scripts=[basename(x) for x in root.scripts if local(x)]
          site_styles=[basename(x) for x in site.styles if local(x)]
          root_styles=[basename(x) for x in root.styles if local(x)]
          assert site_scripts, 'site/index.html has no local runtime scripts'
          assert site_scripts == root_scripts, f'root/site script lineage drift: {root_scripts} != {site_scripts}'
          assert site_styles == root_styles, f'root/site stylesheet lineage drift: {root_styles} != {site_styles}'
          assert 'genesis-birth-r0-6.js' in site_scripts
          assert 'genesis-player-mirror-r0-7.js' in site_scripts
          birth=site_scripts.index('genesis-birth-r0-6.js')
          world=site_scripts.index('genesis-world-runtime-v5.js')
          mirror=site_scripts.index('genesis-player-mirror-r0-7.js')
          assert birth < world < mirror, f'causal/presentation load order invalid: birth={birth} world={world} mirror={mirror}'

          site_root=Path('site').resolve()
          for ref in site.scripts + site.styles:
              if not local(ref): continue
              clean=ref.split('?',1)[0].split('#',1)[0]
              target=(Path('site')/clean).resolve()
              try: target.relative_to(site_root)
              except ValueError: raise AssertionError(f'path escapes site/: {ref}')
              assert target.is_file() and target.stat().st_size > 0, f'missing active site dependency: {target}'

          repo_root=Path('.').resolve()
          for ref in root.scripts + root.styles:
              if not local(ref): continue
              clean=ref.split('?',1)[0].split('#',1)[0]
              target=(repo_root/clean).resolve()
              try: target.relative_to(repo_root)
              except ValueError: raise AssertionError(f'root path escape: {ref}')
              assert target.is_file() and target.stat().st_size > 0, f'missing active root dependency: {target}'

          active=[]
          for ref in site.scripts:
              if local(ref) and basename(ref).endswith('.js'):
                  active.append(str((Path('site')/ref.split('?',1)[0].split('#',1)[0]).resolve()))
          Path('/tmp/genesis-active-js.txt').write_text('\n'.join(active)+'\n',encoding='utf-8')
          print('ACTIVE_RUNTIME_SCRIPTS', *site_scripts, sep='\n- ')
          print('ACTIVE_RUNTIME_STYLES', *site_styles, sep='\n- ')
          PY
          while IFS= read -r js; do
            test -n "$js" || continue
            node --check "$js"
          done < /tmp/genesis-active-js.txt
          node --check genesis-audio-forge.js

      - name: Build compatibility artifact for audit only
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/contracts
          cp -R site/. _site/
          cp genesis-audio-forge.js _site/genesis-audio-forge.js
          cp GENESIS_PAGES_RELEASE.json _site/GENESIS_PAGES_RELEASE.json
          cp .janus/GENESIS_LAWS_V1.json _site/contracts/GENESIS_LAWS_V1.json
          cp .janus/GENESIS_KERNEL_ROADMAP_V1.json _site/contracts/GENESIS_KERNEL_ROADMAP_V1.json
          cp .janus/GENESIS_WORLD_SHELL_R0.json _site/contracts/GENESIS_WORLD_SHELL_R0.json
          cp .janus/GENESIS_ACTION_FORGE_R0.json _site/contracts/GENESIS_ACTION_FORGE_R0.json
          cp .janus/GENESIS_FULL_RUNTIME_V1.json _site/contracts/GENESIS_FULL_RUNTIME_V1.json
          cp .janus/GENESIS_COMMAND_RUNTIME_R0_3.json _site/contracts/GENESIS_COMMAND_RUNTIME_R0_3.json
          cp .janus/GENESIS_SCENE_INTENT_GRAPH_R0_4.json _site/contracts/GENESIS_SCENE_INTENT_GRAPH_R0_4.json
          cp .janus/GENESIS_PAROGRAD_KRIEGER_R0_5.json _site/contracts/GENESIS_PAROGRAD_KRIEGER_R0_5.json
          cp .janus/GENESIS_PROVIDER_FALLBACK_R0_5_1.json _site/contracts/GENESIS_PROVIDER_FALLBACK_R0_5_1.json
          cp .janus/GENESIS_BIRTH_R0_6.json _site/contracts/GENESIS_BIRTH_R0_6.json
          cp .janus/GENESIS_PLAYER_MIRROR_R0_7.json _site/contracts/GENESIS_PLAYER_MIRROR_R0_7.json
          touch _site/.nojekyll
          for f in index.html kernel-lab.html genesis-birth-r0-6.js genesis-world-runtime-v5.js genesis-player-mirror-r0-7.js genesis-command-bridge-v5.js genesis-asset-materializer-v3.js genesis-public-provider-fallback-r0-5-1.js genesis-asset-trunk-r0-5-1.js genesis-audio-asset-runtime-r0-5-1.js genesis-scene-graph-executor-r0-5-1.js GENESIS_PAGES_RELEASE.json; do test -s "_site/$f"; done
          for f in GENESIS_BIRTH_R0_6.json GENESIS_PLAYER_MIRROR_R0_7.json GENESIS_PROVIDER_FALLBACK_R0_5_1.json; do test -s "_site/contracts/$f"; done

      - name: Audit compatibility artifact dependencies
        run: |
          set -euo pipefail
          python - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          import subprocess

          class Refs(HTMLParser):
              def __init__(self):
                  super().__init__(); self.refs=[]
              def handle_starttag(self, tag, attrs):
                  a=dict(attrs)
                  if tag=='script' and a.get('src'): self.refs.append(a['src'])
                  if tag=='link' and a.get('href') and a.get('rel','').lower()=='stylesheet': self.refs.append(a['href'])

          root=Path('_site').resolve(); p=Refs(); p.feed((root/'index.html').read_text(encoding='utf-8'))
          for ref in p.refs:
              if ref.startswith(('http://','https://','//','data:','#')): continue
              clean=ref.split('?',1)[0].split('#',1)[0]
              target=(root/clean).resolve()
              try: target.relative_to(root)
              except ValueError: raise AssertionError(f'artifact path escape: {ref}')
              assert target.is_file() and target.stat().st_size > 0, f'artifact missing dependency: {ref}'
              if target.suffix=='.js': subprocess.run(['node','--check',str(target)],check=True)
          print(f'ARTIFACT_DEPENDENCY_AUDIT_PASS refs={len(p.refs)}')
          PY

  verify_live:
    name: Verify branch-deployed Genesis
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release witness
        uses: actions/checkout@v6

      - name: Wait for built-in Pages and prove current release
        env:
          PAGE_URL: https://hawkar-usls.github.io/Janus_Genesis/
        run: |
          set -euo pipefail
          base="${PAGE_URL%/}"
          expected="$(python - <<'PY'
          import json
          print(json.load(open('GENESIS_PAGES_RELEASE.json',encoding='utf-8'))['release_id'])
          PY
          )"
          matched=0
          for attempt in $(seq 1 24); do
            if curl -fsSL --retry 2 --retry-delay 1 "$base/GENESIS_PAGES_RELEASE.json?release=${GITHUB_SHA}&attempt=${attempt}" -o /tmp/live-release.json; then
              actual="$(python - <<'PY'
          import json
          try:
              print(json.load(open('/tmp/live-release.json',encoding='utf-8')).get('release_id',''))
          except Exception:
              print('')
          PY
          )"
              if [ "$actual" = "$expected" ]; then
                matched=1
                break
              fi
            fi
            sleep 5
          done
          test "$matched" = 1

          curl -fL --retry 8 --retry-delay 2 --retry-all-errors "$PAGE_URL?release=${GITHUB_SHA}" -o /tmp/genesis-live.html
          grep -F 'GENESIS // BIRTH R0.6' /tmp/genesis-live.html >/dev/null
          grep -F 'MIRROR R0.7' /tmp/genesis-live.html >/dev/null
          grep -F './site/genesis-birth-r0-6.js' /tmp/genesis-live.html >/dev/null
          grep -F './site/genesis-world-runtime-v5.js' /tmp/genesis-live.html >/dev/null
          grep -F './site/genesis-player-mirror-r0-7.js' /tmp/genesis-live.html >/dev/null
          grep -F './site/genesis-public-provider-fallback-r0-5-1.js' /tmp/genesis-live.html >/dev/null
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors "$base/site/genesis-birth-r0-6.js?release=${GITHUB_SHA}" -o /tmp/genesis-birth.js
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors "$base/site/genesis-world-runtime-v5.js?release=${GITHUB_SHA}" -o /tmp/genesis-runtime.js
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors "$base/site/genesis-player-mirror-r0-7.js?release=${GITHUB_SHA}" -o /tmp/genesis-mirror.js
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors "$base/site/genesis-public-provider-fallback-r0-5-1.js?release=${GITHUB_SHA}" -o /tmp/genesis-provider.js
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors "$base/site/genesis-audio-forge.js?release=${GITHUB_SHA}" -o /tmp/genesis-audio-bridge.js
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors "$base/contracts/GENESIS_BIRTH_R0_6.json?release=${GITHUB_SHA}" -o /tmp/genesis-birth-contract.json
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors "$base/contracts/GENESIS_PLAYER_MIRROR_R0_7.json?release=${GITHUB_SHA}" -o /tmp/genesis-mirror-contract.json
          curl -fL --retry 8 --retry-delay 2 --retry-all-errors "$base/contracts/GENESIS_PROVIDER_FALLBACK_R0_5_1.json?release=${GITHUB_SHA}" -o /tmp/genesis-provider-contract.json
          test -s /tmp/genesis-birth.js
          test -s /tmp/genesis-runtime.js
          test -s /tmp/genesis-mirror.js
          test -s /tmp/genesis-provider.js
          test -s /tmp/genesis-audio-bridge.js
          node --check /tmp/genesis-birth.js
          node --check /tmp/genesis-runtime.js
          node --check /tmp/genesis-mirror.js
          node --check /tmp/genesis-provider.js
          node --check /tmp/genesis-audio-bridge.js
          python -m json.tool /tmp/genesis-birth-contract.json >/dev/null
          python -m json.tool /tmp/genesis-mirror-contract.json >/dev/null
          python -m json.tool /tmp/genesis-provider-contract.json >/dev/null
          python - <<'PY'
          import json
          birth=json.load(open('/tmp/genesis-birth-contract.json',encoding='utf-8'))
          mirror=json.load(open('/tmp/genesis-mirror-contract.json',encoding='utf-8'))
          assert birth['contract_id']=='GENESIS_BIRTH_R0_6'
          assert birth['birth_event']['chronicle_order'][:2]==['GENESIS_BIRTH','CHUNK_DISCOVERED']
          assert mirror['contract_id']=='GENESIS_PLAYER_MIRROR_R0_7'
          assert mirror['profiles']['JANUS_16']['palette_budget']==16
          assert mirror['profiles']['JANUS_16']['postprocess']=='LOW_RESOLUTION_PALETTE_QUANTIZATION'
          assert mirror['rendering']['changes_world_state'] is False
          assert mirror['rendering']['changes_chronicle'] is False
          assert mirror['inspiration_provenance'][0]['copied_assets'] is False
          assert mirror['inspiration_provenance'][0]['copied_source_code'] is False
          assert mirror['inspiration_provenance'][0]['copied_palette'] is False
          PY
          echo "GENESIS_PLAYER_MIRROR_R0_7_LIVE_PASS $PAGE_URL $expected"
