name: Genesis Generative Kernel Pages

on:
  pull_request:
    paths:
      - '.janus/GENESIS_LAWS_V1.json'
      - '.janus/GENESIS_KERNEL_ROADMAP_V1.json'
      - '.janus/GENESIS_WORLD_SHELL_R0.json'
      - '.janus/GENESIS_ACTION_FORGE_R0.json'
      - '.janus/GENESIS_FULL_RUNTIME_V1.json'
      - 'contracts/GENESIS_WORLD_SHELL_R0.json'
      - 'contracts/GENESIS_ACTION_FORGE_R0.json'
      - 'contracts/GENESIS_FULL_RUNTIME_V1.json'
      - 'genesis-audio-forge.js'
      - 'index.html'
      - 'kernel-lab.html'
      - 'site/**'
      - 'asset_sources/**'
      - 'docs/GENESIS_WORLD_SHELL_R0.md'
      - 'docs/GENESIS_ACTION_FORGE_R0.md'
      - 'tests/test_genesis_pages_contracts.py'
      - 'tests/test_genesis_world_shell.py'
      - 'tests/test_genesis_action_forge.py'
      - 'tests/test_genesis_full_runtime_v1.py'
      - '.github/workflows/genesis-pages.yml'
  push:
    branches: [main]
    paths:
      - '.janus/GENESIS_LAWS_V1.json'
      - '.janus/GENESIS_KERNEL_ROADMAP_V1.json'
      - '.janus/GENESIS_WORLD_SHELL_R0.json'
      - '.janus/GENESIS_ACTION_FORGE_R0.json'
      - '.janus/GENESIS_FULL_RUNTIME_V1.json'
      - 'contracts/GENESIS_WORLD_SHELL_R0.json'
      - 'contracts/GENESIS_ACTION_FORGE_R0.json'
      - 'contracts/GENESIS_FULL_RUNTIME_V1.json'
      - 'genesis-audio-forge.js'
      - 'index.html'
      - 'kernel-lab.html'
      - 'site/**'
      - 'asset_sources/**'
      - 'docs/GENESIS_WORLD_SHELL_R0.md'
      - 'docs/GENESIS_ACTION_FORGE_R0.md'
      - 'tests/test_genesis_pages_contracts.py'
      - 'tests/test_genesis_world_shell.py'
      - 'tests/test_genesis_action_forge.py'
      - 'tests/test_genesis_full_runtime_v1.py'
      - '.github/workflows/genesis-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: genesis-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate frozen contracts and World Shell
        run: |
          python -m unittest tests.test_genesis_pages_contracts -v
          python -m unittest tests.test_genesis_world_shell -v
          python -m unittest tests.test_genesis_action_forge -v
          python -m unittest tests.test_genesis_full_runtime_v1 -v

      - name: Validate browser JavaScript syntax
        run: |
          node --check site/genesis-world-shell.js
          node --check site/genesis-world-shell-v2.js
          node --check site/genesis-action-input-ru.js
          node --check site/genesis-action-forge.js
          node --check site/genesis-world-runtime-v3.js
          node --check site/genesis-janus-bridge-v1.js
          node --check site/genesis-asset-materializer-v1.js
          node --check site/genesis-audio-runtime-v1.js
          node --check site/genesis-hotkeys-v1.js
          node --check site/genesis-pages.js
          node --check genesis-audio-forge.js

      - name: Stage static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/contracts
          cp -R site/. _site/
          cp genesis-audio-forge.js _site/genesis-audio-forge.js
          cp .janus/GENESIS_LAWS_V1.json _site/contracts/GENESIS_LAWS_V1.json
          cp .janus/GENESIS_KERNEL_ROADMAP_V1.json _site/contracts/GENESIS_KERNEL_ROADMAP_V1.json
          cp .janus/GENESIS_WORLD_SHELL_R0.json _site/contracts/GENESIS_WORLD_SHELL_R0.json
          cp .janus/GENESIS_ACTION_FORGE_R0.json _site/contracts/GENESIS_ACTION_FORGE_R0.json
          cp .janus/GENESIS_FULL_RUNTIME_V1.json _site/contracts/GENESIS_FULL_RUNTIME_V1.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/kernel-lab.html
          test -s _site/genesis-world-shell.js
          test -s _site/genesis-world-shell-v2.js
          test -s _site/genesis-action-input-ru.js
          test -s _site/genesis-action-forge.js
          test -s _site/genesis-world-runtime-v3.js
          test -s _site/genesis-janus-bridge-v1.js
          test -s _site/genesis-asset-materializer-v1.js
          test -s _site/genesis-audio-runtime-v1.js
          test -s _site/genesis-hotkeys-v1.js
          test -s _site/world-shell.css
          test -s _site/world-shell-camera.css
          test -s _site/action-forge.css
          test -s _site/runtime-v3.css
          test -s _site/genesis-pages.js
          test -s _site/genesis-pages.css
          test -s _site/genesis-audio-forge.js
          test -s _site/contracts/GENESIS_LAWS_V1.json
          test -s _site/contracts/GENESIS_KERNEL_ROADMAP_V1.json
          test -s _site/contracts/GENESIS_WORLD_SHELL_R0.json
          test -s _site/contracts/GENESIS_ACTION_FORGE_R0.json
          test -s _site/contracts/GENESIS_FULL_RUNTIME_V1.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
