name: Genesis Generative Kernel Pages

on:
  pull_request:
    paths:
      - '.janus/GENESIS_LAWS_V1.json'
      - '.janus/GENESIS_KERNEL_ROADMAP_V1.json'
      - '.janus/GENESIS_WORLD_SHELL_R0.json'
      - '.janus/GENESIS_ACTION_FORGE_R0.json'
      - '.janus/GENESIS_FULL_RUNTIME_V1.json'
      - '.janus/GENESIS_COMMAND_RUNTIME_R0_3.json'
      - '.janus/GENESIS_SCENE_INTENT_GRAPH_R0_4.json'
      - '.janus/GENESIS_PAROGRAD_KRIEGER_R0_5.json'
      - 'contracts/**'
      - 'genesis-audio-forge.js'
      - 'index.html'
      - 'kernel-lab.html'
      - 'site/**'
      - 'asset_sources/**'
      - 'tests/test_genesis_pages_contracts.py'
      - 'tests/test_genesis_world_shell.py'
      - 'tests/test_genesis_action_forge.py'
      - 'tests/test_genesis_full_runtime_v1.py'
      - 'tests/test_genesis_command_runtime_r0_3.py'
      - 'tests/test_genesis_scene_intent_graph_r0_4.py'
      - 'tests/test_genesis_parograd_krieger_r0_5.py'
      - '.github/workflows/genesis-pages.yml'
  push:
    branches: [main]
    paths:
      - '.janus/GENESIS_LAWS_V1.json'
      - '.janus/GENESIS_KERNEL_ROADMAP_V1.json'
      - '.janus/GENESIS_WORLD_SHELL_R0.json'
      - '.janus/GENESIS_ACTION_FORGE_R0.json'
      - '.janus/GENESIS_FULL_RUNTIME_V1.json'
      - '.janus/GENESIS_COMMAND_RUNTIME_R0_3.json'
      - '.janus/GENESIS_SCENE_INTENT_GRAPH_R0_4.json'
      - '.janus/GENESIS_PAROGRAD_KRIEGER_R0_5.json'
      - 'contracts/**'
      - 'genesis-audio-forge.js'
      - 'index.html'
      - 'kernel-lab.html'
      - 'site/**'
      - 'asset_sources/**'
      - 'tests/test_genesis_pages_contracts.py'
      - 'tests/test_genesis_world_shell.py'
      - 'tests/test_genesis_action_forge.py'
      - 'tests/test_genesis_full_runtime_v1.py'
      - 'tests/test_genesis_command_runtime_r0_3.py'
      - 'tests/test_genesis_scene_intent_graph_r0_4.py'
      - 'tests/test_genesis_parograd_krieger_r0_5.py'
      - '.github/workflows/genesis-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: genesis-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate frozen contracts and active runtime overlays
        run: |
          python -m unittest tests.test_genesis_pages_contracts -v
          python -m unittest tests.test_genesis_world_shell -v
          python -m unittest tests.test_genesis_action_forge -v
          python -m unittest tests.test_genesis_full_runtime_v1 -v
          python -m unittest tests.test_genesis_command_runtime_r0_3 -v
          python -m unittest tests.test_genesis_scene_intent_graph_r0_4 -v
          python -m unittest tests.test_genesis_parograd_krieger_r0_5 -v
          python -m json.tool .janus/GENESIS_PAROGRAD_KRIEGER_R0_5.json >/dev/null
          python -m json.tool asset_sources/ASSET_SOURCE_REGISTRY_R0_5.json >/dev/null
          python -m json.tool asset_sources/MECHANIC_RECIPE_SOURCE_REGISTRY_R0_5.json >/dev/null
          python - <<'PY'
          import json
          from pathlib import Path
          for name in ('GENESIS_COMMAND_RUNTIME_R0_3.json','GENESIS_SCENE_INTENT_GRAPH_R0_4.json','GENESIS_PAROGRAD_KRIEGER_R0_5.json'):
              a=json.loads((Path('.janus')/name).read_text())
              b=json.loads((Path('contracts')/name).read_text())
              assert a == b, name
          PY

      - name: Validate browser JavaScript syntax
        run: |
          node --check site/genesis-world-shell.js
          node --check site/genesis-world-shell-v2.js
          node --check site/genesis-action-input-ru.js
          node --check site/genesis-action-forge.js
          node --check site/genesis-world-runtime-v3.js
          node --check site/genesis-world-runtime-v4.js
          node --check site/genesis-world-runtime-v5.js
          node --check site/genesis-janus-bridge-v1.js
          node --check site/genesis-command-bridge-v2.js
          node --check site/genesis-command-bridge-v3.js
          node --check site/genesis-command-lexicon-r0-5.js
          node --check site/genesis-asset-materializer-v1.js
          node --check site/genesis-asset-materializer-v2.js
          node --check site/genesis-asset-trunk-r0-5.js
          node --check site/genesis-audio-runtime-v1.js
          node --check site/genesis-hotkeys-v1.js
          node --check site/genesis-hotkeys-v2.js
          node --check site/genesis-hotkeys-v3.js
          node --check site/genesis-mechanic-forge-r0-5.js
          node --check site/genesis-scene-graph-executor-r0-4.js
          node --check site/genesis-scene-graph-executor-r0-5.js
          node --check site/genesis-command-bridge-v4.js
          node --check site/genesis-command-bridge-v5.js
          node --check site/genesis-pages.js
          node --check genesis-audio-forge.js

      - name: Stage static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/contracts
          cp -R site/. _site/
          cp genesis-audio-forge.js _site/genesis-audio-forge.js
          cp .janus/GENESIS_LAWS_V1.json _site/contracts/GENESIS_LAWS_V1.json
          cp .janus/GENESIS_KERNEL_ROADMAP_V1.json _site/contracts/GENESIS_KERNEL_ROADMAP_V1.json
          cp .janus/GENESIS_WORLD_SHELL_R0.json _site/contracts/GENESIS_WORLD_SHELL_R0.json
          cp .janus/GENESIS_ACTION_FORGE_R0.json _site/contracts/GENESIS_ACTION_FORGE_R0.json
          cp .janus/GENESIS_FULL_RUNTIME_V1.json _site/contracts/GENESIS_FULL_RUNTIME_V1.json
          cp .janus/GENESIS_COMMAND_RUNTIME_R0_3.json _site/contracts/GENESIS_COMMAND_RUNTIME_R0_3.json
          cp .janus/GENESIS_SCENE_INTENT_GRAPH_R0_4.json _site/contracts/GENESIS_SCENE_INTENT_GRAPH_R0_4.json
          cp .janus/GENESIS_PAROGRAD_KRIEGER_R0_5.json _site/contracts/GENESIS_PAROGRAD_KRIEGER_R0_5.json
          touch _site/.nojekyll
          for f in index.html kernel-lab.html genesis-world-runtime-v5.js genesis-command-lexicon-r0-5.js genesis-asset-trunk-r0-5.js genesis-hotkeys-v3.js genesis-mechanic-forge-r0-5.js genesis-scene-graph-executor-r0-5.js genesis-command-bridge-v5.js genesis-audio-runtime-v1.js genesis-asset-materializer-v2.js scene-graph-r0-4.css; do test -s "_site/$f"; done
          for f in GENESIS_LAWS_V1.json GENESIS_KERNEL_ROADMAP_V1.json GENESIS_WORLD_SHELL_R0.json GENESIS_ACTION_FORGE_R0.json GENESIS_FULL_RUNTIME_V1.json GENESIS_COMMAND_RUNTIME_R0_3.json GENESIS_SCENE_INTENT_GRAPH_R0_4.json GENESIS_PAROGRAD_KRIEGER_R0_5.json; do test -s "_site/contracts/$f"; done

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4