name: Genesis Generative Kernel Pages

on:
  pull_request:
    paths:
      - '.janus/GENESIS_LAWS_V1.json'
      - '.janus/GENESIS_KERNEL_ROADMAP_V1.json'
      - 'genesis-audio-forge.js'
      - 'site/**'
      - 'tests/test_genesis_pages_contracts.py'
      - '.github/workflows/genesis-pages.yml'
  push:
    branches: [main]
    paths:
      - '.janus/GENESIS_LAWS_V1.json'
      - '.janus/GENESIS_KERNEL_ROADMAP_V1.json'
      - 'genesis-audio-forge.js'
      - 'site/**'
      - 'tests/test_genesis_pages_contracts.py'
      - '.github/workflows/genesis-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: genesis-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Validate and package Pages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate frozen contracts and control plane
        run: python -m unittest tests.test_genesis_pages_contracts -v

      - name: Stage static Pages artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf _site
          mkdir -p _site/contracts
          cp -R site/. _site/
          cp genesis-audio-forge.js _site/genesis-audio-forge.js
          cp .janus/GENESIS_LAWS_V1.json _site/contracts/GENESIS_LAWS_V1.json
          cp .janus/GENESIS_KERNEL_ROADMAP_V1.json _site/contracts/GENESIS_KERNEL_ROADMAP_V1.json
          touch _site/.nojekyll
          test -s _site/index.html
          test -s _site/genesis-pages.js
          test -s _site/genesis-pages.css
          test -s _site/genesis-audio-forge.js
          test -s _site/contracts/GENESIS_LAWS_V1.json
          test -s _site/contracts/GENESIS_KERNEL_ROADMAP_V1.json

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    name: Deploy GitHub Pages
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy artifact
        id: deployment
        uses: actions/deploy-pages@v4
