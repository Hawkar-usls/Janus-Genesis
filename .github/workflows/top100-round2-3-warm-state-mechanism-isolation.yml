name: Top-100 Round-2.3 Warm-State Mechanism Isolation

on:
  pull_request:
    paths:
      - "benchmarks/round2_3_warm_state_mechanism_isolation_v0.1.json"
      - "benchmarks/round2_2_nondeterminism_isolation_v0.1.json"
      - "benchmarks/round2_1_capability_preserving_quantization_admission_v0.1.json"
      - "benchmarks/frozen_samples/top100_round2_fp16_critical_reference_v0.1.json"
      - "benchmarks/frozen_samples/top100_round1_stratified_v0.1.json"
      - "benchmarks/frozen_receipts/top100_round2_quantization_routing_report_v0.1.json.gz.b64"
      - "tools/run_top100_round1_stratified.py"
      - "tools/run_top100_round2_1_capability_admission.py"
      - "tools/run_top100_round2_1_capability_admission_hardened.py"
      - "tools/run_top100_round2_2_nondeterminism_isolation.py"
      - "tools/run_top100_round2_3_warm_state_mechanism_isolation.py"
      - "tests/test_top100_round2_3_warm_state_mechanism_isolation.py"
      - ".github/workflows/top100-round2-3-warm-state-mechanism-isolation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  warm-state-mechanism-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OLLAMA_HOST: 127.0.0.1:11434
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and unit-test Round-2.3 semantics
        run: |
          python -m py_compile \
            tools/run_top100_round2_3_warm_state_mechanism_isolation.py \
            tests/test_top100_round2_3_warm_state_mechanism_isolation.py
          python -m json.tool benchmarks/round2_3_warm_state_mechanism_isolation_v0.1.json >/dev/null
          python -m unittest tests.test_top100_round2_3_warm_state_mechanism_isolation -v

      - name: Verify append-only frozen lineage
        run: |
          test "$(git hash-object benchmarks/round2_2_nondeterminism_isolation_v0.1.json)" = "652521df326080ad3666c3b3a77ebdc3474f3185"
          test "$(git hash-object benchmarks/round2_1_capability_preserving_quantization_admission_v0.1.json)" = "a88952b4c71f86369512c94b618f27e63e5db447"
          test "$(git hash-object benchmarks/frozen_samples/top100_round2_fp16_critical_reference_v0.1.json)" = "6743337b8a6357783858c71fad01720d034b63ca"
          test "$(git hash-object benchmarks/frozen_samples/top100_round1_stratified_v0.1.json)" = "ca27652feb3532ff52e8453dd055b608711b0d43"
          test "$(git hash-object benchmarks/frozen_receipts/top100_round2_quantization_routing_report_v0.1.json.gz.b64)" = "c8e5b2f07dfaa7d7e86d10794bba4543417c22d6"
          echo "ROUND2_2_PARENT_REPORT_SHA256=a6a596898769fdba79572003f0c216f6f54431dc7d6ed35dfa5f790735049b6a"
          echo "ROUND2_2_WARM_TRACE_SHA256=71b2ee5894e7312c939fbc932a0dc8847d0c797ad9772420f2c38774507640e4"
          echo "CRITICAL_SET_CANONICAL_SHA256=aa04c2befda34e6a9a27b73360c55150617d3008f1d8fe82a6b49ad93f14e97c"

      - name: Install pinned Ollama 0.30.8
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq zstd
          curl -fsSL https://github.com/ollama/ollama/releases/download/v0.30.8/install.sh -o /tmp/ollama-install.sh
          echo "25f64b810b947145095956533e1bdf56eacea2673c55a7e586be4515fc882c9f  /tmp/ollama-install.sh" | sha256sum -c -
          OLLAMA_VERSION=0.30.8 OLLAMA_NO_START=1 sh /tmp/ollama-install.sh

      - name: Start Ollama and pull exact Q8_0 identity
        run: |
          nohup ollama serve > /tmp/ollama-round23.log 2>&1 &
          for i in $(seq 1 60); do
            curl -fsS http://127.0.0.1:11434/api/version >/tmp/ollama-version.json && break
            sleep 1
          done
          pulled=0
          for attempt in 1 2 3 4; do
            if ollama pull qwen2.5:0.5b-instruct-q8_0; then
              pulled=1
              echo "MODEL_PULL_SUCCESS attempt=$attempt"
              break
            fi
            echo "MODEL_PULL_RETRY attempt=$attempt/4"
            [ "$attempt" -eq 4 ] || sleep 3
          done
          [ "$pulled" -eq 1 ]
          python - <<'PY'
          import json
          import urllib.request
          value = json.load(urllib.request.urlopen("http://127.0.0.1:11434/api/tags"))
          rows = {r.get("name") or r.get("model"): r for r in value["models"]}
          tag = "qwen2.5:0.5b-instruct-q8_0"
          expected = "84d044692a2ce0a5a063d3177ca7a69fb189fd81b3139a7a3ead74ccf42a51dc"
          row = rows[tag]
          assert row["digest"] == expected, (row["digest"], expected)
          assert row["size"] == 531081605, row["size"]
          print(f"MODEL_IDENTITY_VERIFIED tag={tag} digest={expected} size={row['size']}")
          PY

      - name: Execute warm-state request-sequence matrix
        run: |
          mkdir -p artifacts/top100-round2-3
          python -m tools.run_top100_round2_3_warm_state_mechanism_isolation \
            --config benchmarks/round2_3_warm_state_mechanism_isolation_v0.1.json \
            --endpoint http://127.0.0.1:11434 \
            --pretty > artifacts/top100-round2-3/report.json

      - name: Validate accounting and print mechanism evidence
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          path = Path("artifacts/top100-round2-3/report.json")
          raw = path.read_bytes()
          r = json.loads(raw)
          assert r["schema"] == "janus.genesis.top100.round2_3_warm_state_mechanism_isolation_report.v1"
          assert r["target_record_count"] == 144
          assert r["frozen_lineage"]["critical_set_count"] == 8
          assert r["frozen_lineage"]["critical_set_canonical_sha256"] == "aa04c2befda34e6a9a27b73360c55150617d3008f1d8fe82a6b49ad93f14e97c"
          assert r["model_receipt"]["digest"] == "84d044692a2ce0a5a063d3177ca7a69fb189fd81b3139a7a3ead74ccf42a51dc"
          assert r["model_receipt"]["size_bytes"] == 531081605
          assert r["admission_rule_changed"] is False
          assert r["promotion_rule_changed"] is False
          assert r["q8_0_promoted"] is False
          assert r["causal_internal_mechanism_claimed"] is False
          assert r["canonical_world_state_mutated"] is False
          p = r["frozen_lineage"]["provenance_verification"]
          assert p["status"] == "VERIFIED_AGAINST_ACTUAL_CONSUMED_BYTES"
          assert p["critical_set_derivation"]["equals_frozen_critical_projection"] is True

          print("REPORT_SHA256=" + hashlib.sha256(raw).hexdigest())
          print("REPORT_BYTES=" + str(len(raw)))
          print("ENVIRONMENT_FINGERPRINT=" + r["environment"]["environment_fingerprint_sha256"])
          print("BACKEND_ATTEMPTS=" + json.dumps(r["backend_attempt_distribution"], sort_keys=True))
          for phase_id, phase in r["assessments"].items():
              print(
                  f"PHASE={phase_id} PASS={phase['pass_count']}/{phase['record_count']} "
                  f"SERVER_IDENTITIES={phase['unique_server_process_identity_count']}"
              )
              for sid, sample in phase["sample_assessments"].items():
                  print(
                      f"  SAMPLE={sid} PASS={sample['pass_count']}/{sample['trial_count']} "
                      f"REQ_UNIQUE={sample['unique_request_payload_count']} "
                      f"OUT_UNIQUE={sample['unique_output_count']} "
                      f"PROC_UNIQUE={sample['unique_server_process_identity_count']} "
                      f"STATUS={'/'.join(sample['status_sequence'])} "
                      f"SEQ_SHA256={sample['sequence_sha256']}"
                  )
          print("MECHANISM_SUMMARY=" + json.dumps(r["mechanism_summary"], sort_keys=True))
          PY

      - name: Upload Round-2.3 mechanism receipt
        uses: actions/upload-artifact@v4
        with:
          name: janus-top100-round2-3-warm-state-mechanism-isolation
          path: artifacts/top100-round2-3/report.json
          if-no-files-found: error
          retention-days: 30
