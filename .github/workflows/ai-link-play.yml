name: AI Link Play

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-and-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile AI link layer
        run: |
          python -m py_compile \
            genesis_v18_7_19_ai_link_play.py \
            genesis_v18_7_playable.py \
            tools/genesis_ai_gateway.py \
            scripts/run_ai_link_play_audit.py
      - name: Validate machine entry files
        run: |
          python -m json.tool ai/GENESIS_AI_ENTRY.json >/dev/null
          python -m json.tool schemas/genesis_ai_link_request_v1.schema.json >/dev/null
          python -m json.tool schemas/genesis_ai_link_capsule_v1.schema.json >/dev/null
      - name: Run complete unit suite
        run: python -m unittest discover -s tests -v
      - name: Smoke provider-neutral manifest
        run: |
          echo '{"operation":"manifest"}' | \
            python tools/genesis_ai_gateway.py \
              --data-dir .ai-link-smoke \
              --request - \
              --pretty
      - name: Run AI link lived audit
        env:
          AUDIT_COMMIT: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          COMMIT="${AUDIT_COMMIT:-$GITHUB_SHA}"
          python scripts/run_ai_link_play_audit.py \
            --output-dir artifacts/ai-link-play-audit \
            --git-commit "$COMMIT"
      - name: Upload AI link proofpack
        uses: actions/upload-artifact@v4
        with:
          name: genesis-ai-link-play-audit
          path: artifacts/ai-link-play-audit
          if-no-files-found: error
          retention-days: 30
