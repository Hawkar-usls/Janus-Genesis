name: Plural Witness Lived Life

on:
  push:
    branches:
      - experiment/plural-witness-lived-life-20260728
  pull_request:
    branches:
      - main

jobs:
  live:
    runs-on: ubuntu-latest
    steps:
      - name: Check out Genesis
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Recover exact Meta Registry
        run: |
          git clone --quiet https://github.com/Hawkar-usls/janus-meta-registry.git /tmp/janus-meta-registry
          git -C /tmp/janus-meta-registry checkout --quiet 53773246f4caabe767642eccfd3cd7746a6b1635
          test "$(git -C /tmp/janus-meta-registry rev-parse HEAD)" = "53773246f4caabe767642eccfd3cd7746a6b1635"
          count="$(find /tmp/janus-meta-registry/data -maxdepth 1 -type f -name '*.json' | wc -l)"
          test "$count" = "192"
          echo "Pinned Meta Registry origins: $count"

      - name: Live among the plural witnesses
        env:
          META_REGISTRY_CHECKOUT: /tmp/janus-meta-registry
        run: |
          PYTHONPATH=. python tools/plural_witness_lived_life.py > plural-witness-lived-life.log 2>&1
          cat plural-witness-lived-life.log

      - name: Upload lived record
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plural-witness-lived-life-record
          path: |
            plural-witness-lived-life.log
            plural_witness_lived_life_summary.json
            plural_witness_life_threshold.genesis-save.json
            plural_witness_lived_life.genesis-save.json
            .plural_witness_life_country_a/
            .plural_witness_life_country_b/
          if-no-files-found: warn
          retention-days: 7
