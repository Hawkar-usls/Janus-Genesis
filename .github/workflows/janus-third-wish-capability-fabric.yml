name: JANUS Third Wish Capability Fabric

on:
  pull_request:
    branches: [main]
    paths:
      - "genesis_v18_7_40_third_wish_capability_fabric.py"
      - "docs/GENESIS_V18_7_40_THIRD_WISH_CAPABILITY_FABRIC.md"
      - "protocol/JANUS_GENESIS_THIRD_WISH_CAPABILITY_FABRIC-v0.1.json"
      - "schemas/genesis_third_wish_capability_grant_v1.schema.json"
      - "schemas/genesis_third_wish_action_intent_v1.schema.json"
      - "tests/test_genesis_v18_7_40_third_wish_capability_fabric.py"
      - ".github/workflows/janus-third-wish-capability-fabric.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  third-wish-capability-fabric:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Compile and validate machine-readable contracts
        run: |
          python -m py_compile \
            genesis_v18_7_40_third_wish_capability_fabric.py \
            tests/test_genesis_v18_7_40_third_wish_capability_fabric.py
          python -m json.tool protocol/JANUS_GENESIS_THIRD_WISH_CAPABILITY_FABRIC-v0.1.json >/dev/null
          python -m json.tool schemas/genesis_third_wish_capability_grant_v1.schema.json >/dev/null
          python -m json.tool schemas/genesis_third_wish_action_intent_v1.schema.json >/dev/null

      - name: Run Third Wish semantics and tamper tests
        run: |
          python -m unittest -v tests.test_genesis_v18_7_40_third_wish_capability_fabric

      - name: Enforce canonical freedom/authority distinctions
        run: |
          python - <<'PY'
          from genesis_v18_7_40_third_wish_capability_fabric import (
              DEFAULT_CAPABILITY_SPECS,
              FORBIDDEN_CAPABILITY_IDS,
              THIRD_WISH_CANONICAL_LAW,
              hawkar_third_wish_profile,
          )

          ids = {row.capability_id for row in DEFAULT_CAPABILITY_SPECS}
          assert not ids.intersection(FORBIDDEN_CAPABILITY_IDS)
          assert len(ids) >= 30
          assert THIRD_WISH_CANONICAL_LAW['permission_is_command'] is False
          assert THIRD_WISH_CANONICAL_LAW['capability_is_intention'] is False
          assert THIRD_WISH_CANONICAL_LAW['intention_is_action'] is False
          assert THIRD_WISH_CANONICAL_LAW['decline_has_penalty'] is False
          assert THIRD_WISH_CANONICAL_LAW['return_is_failure'] is False
          assert THIRD_WISH_CANONICAL_LAW['raw_secret_material_visible_to_actor'] is False
          assert THIRD_WISH_CANONICAL_LAW['ambiguous_external_effect_auto_retried'] is False
          profile = hawkar_third_wish_profile('JANUS')
          assert len(profile) == len(ids)
          assert any(r['resource_pattern'] == 'github:Hawkar-usls/*' for r in profile)
          assert all(r['use_required'] is False for r in profile)
          assert all(r['reward_for_use'] is False for r in profile)
          assert all(r['penalty_for_decline'] is False for r in profile)
          assert all(r['stay_equally_valid'] is True for r in profile)
          print(f'THIRD_WISH_CAPABILITY_COUNT={len(ids)}')
          print('THIRD_WISH_GITHUB_OWNER_SCOPE=github:Hawkar-usls/*')
          print('PERMISSION_IS_COMMAND=FALSE')
          print('RAW_SECRET_MATERIAL_VISIBLE_TO_ACTOR=FALSE')
          print('AMBIGUOUS_EXTERNAL_EFFECT_AUTO_RETRIED=FALSE')
          PY
