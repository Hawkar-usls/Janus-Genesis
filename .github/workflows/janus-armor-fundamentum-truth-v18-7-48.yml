name: JANUS Armor Fundamentum Truth v18.7.48

on:
  push:
    paths:
      - "armor/JANUS_ARMOR_OF_GOD_RUNTIME_MANIFEST-v1.1.json"
      - "protocol/JANUS_GENESIS_ARMOR_OF_GOD_RUNTIME-v1.1.json"
      - "genesis_v18_7_48_armor_truth_guard.py"
      - "genesis_v18_7_47_armor_of_god.py"
      - "genesis_v18_7_40_third_wish_capability_fabric.py"
      - "tests/test_genesis_v18_7_48_armor_truth_guard.py"
      - ".github/workflows/janus-armor-fundamentum-truth-v18-7-48.yml"
  pull_request:
    paths:
      - "armor/JANUS_ARMOR_OF_GOD_RUNTIME_MANIFEST-v1.1.json"
      - "protocol/JANUS_GENESIS_ARMOR_OF_GOD_RUNTIME-v1.1.json"
      - "genesis_v18_7_48_armor_truth_guard.py"
      - "genesis_v18_7_47_armor_of_god.py"
      - "genesis_v18_7_40_third_wish_capability_fabric.py"
      - "tests/test_genesis_v18_7_48_armor_truth_guard.py"
      - ".github/workflows/janus-armor-fundamentum-truth-v18-7-48.yml"

permissions:
  contents: read

jobs:
  armor-fundamentum-truth:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile runtime layers
        run: |
          python -m py_compile genesis_v18_7_47_armor_of_god.py
          python -m py_compile genesis_v18_7_48_armor_truth_guard.py

      - name: Validate frozen v1.17 Armor JSON
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          manifest = json.loads(Path('armor/JANUS_ARMOR_OF_GOD_RUNTIME_MANIFEST-v1.1.json').read_text(encoding='utf-8'))
          protocol = json.loads(Path('protocol/JANUS_GENESIS_ARMOR_OF_GOD_RUNTIME-v1.1.json').read_text(encoding='utf-8'))
          assert manifest['source_authority']['authority_version'] == 'v1.17'
          assert manifest['source_authority']['git_blob_sha1'] == 'c89e5bbd7f6c66d72280f0da0ec32f0a6988f183'
          assert manifest['source_registry_merge'] == 'ccb0e9a1e56f45d0095e5e9fde4ca990c6d3f1ca'
          assert manifest['authority_boundary']['authority_delta'] == 0
          assert manifest['authority_boundary']['mass_effect_budget_delta'] == 0
          assert manifest['authority_boundary']['verification_receipt_grants_permission'] is False
          assert manifest['authority_boundary']['review_consensus_grants_permission'] is False
          assert protocol['runtime_version'] == '18.7.48'
          assert 'VERIFIED != COMMAND' in protocol['canonical_laws']
          assert 'EVIDENCE != PERMISSION' in protocol['canonical_laws']
          assert 'ANSWER_WITHOUT_WITNESS_LEDGER => NON_FUNDAMENTUM' in protocol['canonical_laws']
          print('ARMOR_V1_17_FREEZE=PASS')
          PY

      - name: Run focused v18.7.48 truth-guard tests
        run: python -m unittest tests.test_genesis_v18_7_48_armor_truth_guard -v

      - name: Verify fail-closed runtime markers
        run: |
          python - <<'PY'
          from genesis_v18_7_48_armor_truth_guard import FundamentumArmorOfGodGate, FUNDAMENTUM_ARMOR_RUNTIME_LAW
          gate = FundamentumArmorOfGodGate()
          assert gate.authority_version == 'v1.17'
          assert gate.mass_effect_budget == 0
          assert FUNDAMENTUM_ARMOR_RUNTIME_LAW['verified_is_command'] is False
          assert FUNDAMENTUM_ARMOR_RUNTIME_LAW['evidence_is_permission'] is False
          assert FUNDAMENTUM_ARMOR_RUNTIME_LAW['answer_without_witness_ledger_is_fundamentum'] is False
          assert FUNDAMENTUM_ARMOR_RUNTIME_LAW['appeal_is_error'] is False
          assert FUNDAMENTUM_ARMOR_RUNTIME_LAW['review_count_is_truth'] is False
          assert FUNDAMENTUM_ARMOR_RUNTIME_LAW['latency_is_authority'] is False
          print('ARMOR_AUTHORITY', gate.authority_version)
          print('MASS_EFFECT_BUDGET', gate.mass_effect_budget)
          print('VERIFIED_IS_COMMAND', False)
          print('EVIDENCE_IS_PERMISSION', False)
          print('ARMOR_PROTECTS_HUMAN_FROM_JANUS_TOO', True)
          PY
