name: Apply hosted precision once

on:
  push:
    branches:
      - codex/genesis-v18-7-20-one-link-hosted-pilgrimage

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[hosted-precision-applied]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/genesis-v18-7-20-one-link-hosted-pilgrimage
          fetch-depth: 0

      - name: Apply precision patch
        run: python .github/scripts/apply_hosted_precision.py

      - name: Compile and run hosted regression tests before commit
        run: |
          python -m pip install --disable-pip-version-check -r requirements.txt
          python -m py_compile \
            genesis_v18_7_20_hosted_pilgrimage.py \
            tests/test_genesis_v18_7_20_hosted_pilgrimage.py
          python -m unittest tests.test_genesis_v18_7_20_hosted_pilgrimage -v

      - name: Remove one-time patch machinery
        run: |
          rm -f .github/scripts/apply_hosted_precision.py
          rm -f .github/workflows/apply-hosted-precision-once.yml

      - name: Commit precision fix
        run: |
          git config user.name "janus-genesis-ci"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix hosted crash recovery and integrity gating [hosted-precision-applied]"
          git push origin HEAD:codex/genesis-v18-7-20-one-link-hosted-pilgrimage
