name: JANUS TRUMP Habitat Research

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/janus-trump-habitat-research.yml'
      - 'tools/trump_habitat_research_agent.py'
      - 'tools/trump_r50g24_pairwise_research_agent.py'
      - 'tools/trump_r50g25_adaptive_third_debt_agent.py'
      - 'tools/trump_r50g26_width3_unique_pair_state_agent.py'
      - 'tools/trump_r50g27_single_polarity_flip_agent.py'
      - 'tools/trump_r50g28_alternate_pivot_audit_agent.py'
  workflow_dispatch:
  schedule:
    - cron: '37 * * * *'

concurrency:
  group: janus-trump-habitat-research
  cancel-in-progress: false

permissions:
  contents: write
  copilot-requests: write

jobs:
  trump-research-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout control plane
        uses: actions/checkout@v4
        with:
          path: control

      - name: Checkout Git Habitat
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus_Genesis
          ref: janus/habitat
          path: habitat-repo
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Discover one queued TRUMP code-research request
        id: discover
        shell: bash
        run: |
          python - <<'PY'
          import json
          import re
          from pathlib import Path
          inbox = Path('habitat-repo/habitat/inbox/trump')
          outbox = Path('habitat-repo/habitat/outbox/trump')
          inbox.mkdir(parents=True, exist_ok=True)
          outbox.mkdir(parents=True, exist_ok=True)
          chosen = None
          for path in sorted(inbox.glob('*.json')):
              try:
                  obj = json.loads(path.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if obj.get('status') != 'QUEUED' or obj.get('purpose') != 'PARALLEL_TRUMP_CODE_RESEARCH':
                  continue
              rid = re.sub(r'[^A-Za-z0-9._-]+', '_', str(obj.get('request_id') or path.stem))[:120]
              if (outbox / f'{rid}.json').exists() or obj.get('source_repo') != 'Hawkar-usls/Janus-Fundamentum':
                  continue
              branch = str(obj.get('source_branch') or '').strip()
              if branch:
                  chosen = (path, branch, rid)
                  break
          output = Path('runtime'); output.mkdir(exist_ok=True)
          if chosen is None:
              (output / 'request.txt').write_text('', encoding='utf-8')
              with open(__import__('os').environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as gh: gh.write('count=0\n')
              print('TRUMP_QUEUED_REQUESTS=0')
          else:
              path, branch, rid = chosen
              (output / 'request.txt').write_text(str(path) + '\n', encoding='utf-8')
              with open(__import__('os').environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as gh:
                  gh.write('count=1\n'); gh.write(f'source_branch={branch}\n'); gh.write(f'request_id={rid}\n')
              print(f'TRUMP_QUEUED_REQUESTS=1 request_id={rid} branch={branch}')
          PY

      - name: Checkout frozen TRUMP source read-only
        if: steps.discover.outputs.count == '1'
        uses: actions/checkout@v4
        with:
          repository: Hawkar-usls/Janus-Fundamentum
          ref: ${{ steps.discover.outputs.source_branch }}
          path: trump-source
          persist-credentials: false
          fetch-depth: 1

      - name: Set up Python
        if: steps.discover.outputs.count == '1'
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Node
        if: steps.discover.outputs.count == '1'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install GitHub Copilot CLI
        if: steps.discover.outputs.count == '1' && !contains(steps.discover.outputs.request_id, 'PAIRWISE-COUNTERPOLARITY-CLOSURE') && !contains(steps.discover.outputs.request_id, 'R50G25-ADAPTIVE-THIRD-DEBT') && !contains(steps.discover.outputs.request_id, 'R50G26-UNIQUE-PAIR-STATE-WIDTH3') && !contains(steps.discover.outputs.request_id, 'R50G27-MINIMUM-NONADDITIVE-SINGLE-LITERAL-POLARITY-FLIP') && !contains(steps.discover.outputs.request_id, 'R50G28-SINGLE-FLIP-DOOR-CLOSED-ALTERNATE-PIVOT-AUDIT')
        run: |
          npm install -g @github/copilot
          copilot --version

      - name: Run read-only JANUS TRUMP research lane
        if: steps.discover.outputs.count == '1'
        env:
          GITHUB_TOKEN: ${{ github.token }}
          COPILOT_AUTO_UPDATE: 'false'
        shell: bash
        run: |
          export TRUMP_SOURCE_SHA="$(git -C trump-source rev-parse HEAD)"
          REQUEST="$(cat runtime/request.txt)"
          RID="${{ steps.discover.outputs.request_id }}"
          if [[ "$RID" == *"R50G28-SINGLE-FLIP-DOOR-CLOSED-ALTERNATE-PIVOT-AUDIT"* ]]; then
            echo "TRUMP_ENGINE=DETERMINISTIC_R50G28_SINGLE_FLIP_DOOR_CLOSED_ALTERNATE_PIVOT_AUDIT"
            python control/tools/trump_r50g28_alternate_pivot_audit_agent.py --request "$REQUEST" --workspace trump-source --habitat-root habitat-repo/habitat
          elif [[ "$RID" == *"R50G27-MINIMUM-NONADDITIVE-SINGLE-LITERAL-POLARITY-FLIP"* ]]; then
            echo "TRUMP_ENGINE=DETERMINISTIC_R50G27_MINIMUM_NONADDITIVE_SINGLE_LITERAL_POLARITY_FLIP"
            python control/tools/trump_r50g27_single_polarity_flip_agent.py --request "$REQUEST" --workspace trump-source --habitat-root habitat-repo/habitat
          elif [[ "$RID" == *"R50G26-UNIQUE-PAIR-STATE-WIDTH3"* ]]; then
            echo "TRUMP_ENGINE=DETERMINISTIC_R50G26_UNIQUE_PAIR_STATE_WIDTH3_STRUCTURAL_SUPPORT"
            python control/tools/trump_r50g26_width3_unique_pair_state_agent.py --request "$REQUEST" --workspace trump-source --habitat-root habitat-repo/habitat
          elif [[ "$RID" == *"R50G25-ADAPTIVE-THIRD-DEBT"* ]]; then
            echo "TRUMP_ENGINE=DETERMINISTIC_R50G25_ADAPTIVE_THIRD_DEBT"
            python control/tools/trump_r50g25_adaptive_third_debt_agent.py --request "$REQUEST" --workspace trump-source --habitat-root habitat-repo/habitat
          elif [[ "$RID" == *"PAIRWISE-COUNTERPOLARITY-CLOSURE"* ]]; then
            echo "TRUMP_ENGINE=DETERMINISTIC_R50G24_PAIRWISE_COUNTERPOLARITY"
            python control/tools/trump_r50g24_pairwise_research_agent.py --request "$REQUEST" --workspace trump-source --habitat-root habitat-repo/habitat
          else
            echo "TRUMP_ENGINE=GENERIC_OR_SINGLE_CLAUSE"
            python control/tools/trump_habitat_research_agent.py --request "$REQUEST" --workspace trump-source --habitat-root habitat-repo/habitat
          fi

      - name: Verify fail-closed TRUMP receipt
        if: steps.discover.outputs.count == '1'
        shell: bash
        env:
          RID: ${{ steps.discover.outputs.request_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          obj=json.loads((Path('habitat-repo/habitat/outbox/trump')/f"{os.environ['RID']}.json").read_text(encoding='utf-8'))
          assert obj['authority']=='RESEARCH_HYPOTHESIS_ONLY'
          tb=obj['truth_boundary']; assert tb['model_output_is_proof'] is False; assert tb['model_output_is_independent_confirmation'] is False; assert tb['p_vs_np']=='OPEN'; assert tb['sat_in_p']=='NOT_PROVED'; assert obj['report']['proof_claim'] is False
          print('TRUMP_FAIL_CLOSED_RECEIPT=PASS')
          PY

      - name: Persist TRUMP research packet in janus/habitat only
        if: steps.discover.outputs.count == '1'
        working-directory: habitat-repo
        shell: bash
        run: |
          git config user.name "janus-trump-research-bot"
          git config user.email "janus-trump-research-bot@users.noreply.github.com"
          git add habitat/outbox/trump habitat/memory/trump
          if git diff --cached --quiet; then echo "TRUMP_HABITAT_NO_CHANGES"; exit 0; fi
          git commit -m "TRUMP: persist bounded JANUS parallel research receipt"
          git pull --rebase origin janus/habitat
          git push origin HEAD:janus/habitat
          echo "TRUMP_HABITAT_PERSIST=PASS"

      - name: No queued TRUMP code-research requests
        if: steps.discover.outputs.count == '0'
        run: echo "TRUMP_HABITAT_IDLE=TRUE"
