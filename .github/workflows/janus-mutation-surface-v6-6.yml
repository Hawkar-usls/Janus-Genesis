name: JANUS mutation surface v6.6

on:
  push:
    paths:
      - 'genesis_v18_7_36_validated_registration_binding.py'
      - 'genesis_v18_7_37_recovery_safe_save_import.py'
      - 'genesis_v18_7_38_durable_network_outbox.py'
      - 'genesis_v18_7_39_typed_mutation_authority.py'
      - 'tests/test_genesis_v18_7_36_validated_registration_binding.py'
      - 'tests/test_genesis_v18_7_37_recovery_safe_save_import.py'
      - 'tests/test_genesis_v18_7_38_durable_network_outbox.py'
      - 'tests/test_genesis_v18_7_39_typed_mutation_authority.py'
      - 'requirements.txt'
      - '.github/workflows/janus-mutation-surface-v6-6.yml'
  pull_request:
    paths:
      - 'genesis_v18_7_36_validated_registration_binding.py'
      - 'genesis_v18_7_37_recovery_safe_save_import.py'
      - 'genesis_v18_7_38_durable_network_outbox.py'
      - 'genesis_v18_7_39_typed_mutation_authority.py'
      - 'tests/test_genesis_v18_7_36_validated_registration_binding.py'
      - 'tests/test_genesis_v18_7_37_recovery_safe_save_import.py'
      - 'tests/test_genesis_v18_7_38_durable_network_outbox.py'
      - 'tests/test_genesis_v18_7_39_typed_mutation_authority.py'
      - 'requirements.txt'
      - '.github/workflows/janus-mutation-surface-v6-6.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutation-surface-descendants:
    name: mutation-surface-descendants (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 22
    steps:
      - name: Checkout Janus Genesis
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install canonical runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile v6.6 descendants
        run: >-
          python -m py_compile
          genesis_v18_7_36_validated_registration_binding.py
          genesis_v18_7_37_recovery_safe_save_import.py
          genesis_v18_7_38_durable_network_outbox.py
          genesis_v18_7_39_typed_mutation_authority.py
          tests/test_genesis_v18_7_36_validated_registration_binding.py
          tests/test_genesis_v18_7_37_recovery_safe_save_import.py
          tests/test_genesis_v18_7_38_durable_network_outbox.py
          tests/test_genesis_v18_7_39_typed_mutation_authority.py

      - name: Run validate-before-bind registration gates
        run: python -m unittest -v tests.test_genesis_v18_7_36_validated_registration_binding

      - name: Run recovery-safe multi-file save import gates
        run: python -m unittest -v tests.test_genesis_v18_7_37_recovery_safe_save_import

      - name: Run durable fail-closed network outbox gates
        run: python -m unittest -v tests.test_genesis_v18_7_38_durable_network_outbox

      - name: Run typed auxiliary mutation authority gates
        run: python -m unittest -v tests.test_genesis_v18_7_39_typed_mutation_authority

      - name: Enforce v6.6 claim boundaries
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          v36 = ' '.join(Path('genesis_v18_7_36_validated_registration_binding.py').read_text(encoding='utf-8').split()).lower()
          v37 = ' '.join(Path('genesis_v18_7_37_recovery_safe_save_import.py').read_text(encoding='utf-8').split()).lower()
          v38 = ' '.join(Path('genesis_v18_7_38_durable_network_outbox.py').read_text(encoding='utf-8').split()).lower()
          v39 = ' '.join(Path('genesis_v18_7_39_typed_mutation_authority.py').read_text(encoding='utf-8').split()).lower()
          required = [
              ('v36', v36, 'validation an explicit pre-binding gate'),
              ('v36', v36, 'no durable registration request row is created until'),
              ('v36', v36, 'does not claim that syntactic admission proves actor identity'),
              ('v37', v37, 'recovery-safe roll-forward saga'),
              ('v37', v37, 'not an atomic multi-file filesystem transaction'),
              ('v37', v37, 'non-cooperating writers that bypass the import lock remain outside'),
              ('v37', v37, 'only after every selected target has the expected hash'),
              ('v38', v38, 'malformed or schema-invalid *existing* state fails closed'),
              ('v38', v38, 'event 1025 is rejected instead of silently deleting the oldest unsent event'),
              ('v38', v38, 'automatic duplicate publication after an ambiguous remote boundary'),
              ('v38', v38, 'no hub-side deduplication/idempotency guarantee has been verified'),
              ('v38', v38, 'durable uncertainty over automatic duplicate publication'),
              ('v39', v39, 'typed request/receipt contracts rather than pretending one generic action envelope'),
              ('v39', v39, 'share the same canonical world lock path'),
              ('v39', v39, 'canonical *cooperating api construction path*, not a python security sandbox'),
              ('v39', v39, 'does not claim global world-authority sealing or multi-host consensus'),
          ]
          missing = [(where, text) for where, haystack, text in required if text not in haystack]
          if missing:
              raise SystemExit('missing v6.6 semantics: ' + repr(missing))
          PY
