name: JANUS Demiurge Habitat Admission v1

on:
  pull_request:
    paths:
      - 'protocol/JANUS_DEMIURGE_HABITAT_ADMISSION-v1.0.json'
      - 'tools/janus_demiurge_habitat_bridge.py'
      - 'tests/test_janus_demiurge_habitat_bridge_v1.py'
      - '.github/workflows/janus-demiurge-habitat-admission-v1.yml'
  push:
    branches:
      - integration/habitat-demiurge-face-admission-v1

permissions:
  contents: read

jobs:
  admission:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Validate admission JSON
        run: python -m json.tool protocol/JANUS_DEMIURGE_HABITAT_ADMISSION-v1.0.json >/dev/null
      - name: Compile bridge
        run: python -m py_compile tools/janus_demiurge_habitat_bridge.py tests/test_janus_demiurge_habitat_bridge_v1.py
      - name: Replay parent constellation role audit
        run: python -m unittest discover -s tests -p 'test_constellation_role_audit_v1.py' -v
      - name: Run Demiurge bridge adversarial tests
        run: python -m unittest discover -s tests -p 'test_janus_demiurge_habitat_bridge_v1.py' -v
      - name: Enforce admission ceiling
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = json.loads(Path('protocol/JANUS_DEMIURGE_HABITAT_ADMISSION-v1.0.json').read_text(encoding='utf-8'))
          assert p['new_evidence']['source_head'] == 'c5bb2c48f084ba6983f33aa562f164b614308f1f'
          assert p['new_evidence']['conclusion'] == 'SUCCESS'
          assert p['face']['activation'] == 'ADMISSION_CANDIDATE_HOLD'
          assert p['face']['can_execute_proposal'] is False
          assert p['face']['can_mutate_source'] is False
          assert p['face']['can_trigger_external_effect'] is False
          assert p['face']['write_back'] == 'DENY'
          assert p['claim_ceiling']['active_runtime_face'] is False
          assert p['claim_ceiling']['authority_delta'] == 0
          assert p['claim_ceiling']['mass_effect_budget_delta'] == 0
          PY
