name: JANUS client control v6.4

on:
  push:
    paths:
      - 'janus_portable_lock.py'
      - 'genesis_v18_7_28_client_ledger_attestation.py'
      - 'genesis_v18_7_29_portable_resource_lifetime.py'
      - 'genesis_v18_7_30_trust_boundary_hardening.py'
      - 'tests/test_genesis_v18_7_28_client_ledger_attestation.py'
      - 'tests/test_genesis_v18_7_29_portable_resource_lifetime.py'
      - 'tests/test_genesis_v18_7_29_linux_runtime_integration.py'
      - 'tests/test_genesis_v18_7_30_trust_boundary_hardening.py'
      - 'genesis_v18_7_19_ai_link_play.py'
      - 'genesis_v18_7_25_durable_journal_fencing.py'
      - 'genesis_v18_7_26_controlled_ai_link.py'
      - 'genesis_v18_7_27_session_review_reconciliation.py'
      - 'requirements.txt'
      - '.github/workflows/janus-client-control-v6-4.yml'
  pull_request:
    paths:
      - 'janus_portable_lock.py'
      - 'genesis_v18_7_28_client_ledger_attestation.py'
      - 'genesis_v18_7_29_portable_resource_lifetime.py'
      - 'genesis_v18_7_30_trust_boundary_hardening.py'
      - 'tests/test_genesis_v18_7_28_client_ledger_attestation.py'
      - 'tests/test_genesis_v18_7_29_portable_resource_lifetime.py'
      - 'tests/test_genesis_v18_7_29_linux_runtime_integration.py'
      - 'tests/test_genesis_v18_7_30_trust_boundary_hardening.py'
      - 'genesis_v18_7_19_ai_link_play.py'
      - 'genesis_v18_7_25_durable_journal_fencing.py'
      - 'genesis_v18_7_26_controlled_ai_link.py'
      - 'genesis_v18_7_27_session_review_reconciliation.py'
      - 'requirements.txt'
      - '.github/workflows/janus-client-control-v6-4.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  portable-control-primitives:
    name: portable-control-primitives (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    steps:
      - name: Checkout Janus Genesis
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Compile portable v6.4 descendants
        run: python -m py_compile janus_portable_lock.py genesis_v18_7_28_client_ledger_attestation.py genesis_v18_7_29_portable_resource_lifetime.py genesis_v18_7_30_trust_boundary_hardening.py tests/test_genesis_v18_7_29_portable_resource_lifetime.py tests/test_genesis_v18_7_30_trust_boundary_hardening.py

      - name: Run v18.7.29 portable adversarial and resource-lifetime tests
        run: python -m unittest -v tests.test_genesis_v18_7_29_portable_resource_lifetime

      - name: Run v18.7.30 trust-boundary hardening tests
        run: python -m unittest -v tests.test_genesis_v18_7_30_trust_boundary_hardening

  linux-canonical-runtime-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout Janus Genesis
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install runtime dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile canonical integration chain
        run: python -m py_compile genesis_v18_7_25_durable_journal_fencing.py genesis_v18_7_26_controlled_ai_link.py genesis_v18_7_27_session_review_reconciliation.py genesis_v18_7_28_client_ledger_attestation.py genesis_v18_7_29_portable_resource_lifetime.py genesis_v18_7_30_trust_boundary_hardening.py tests/test_genesis_v18_7_29_linux_runtime_integration.py tests/test_genesis_v18_7_30_trust_boundary_hardening.py

      - name: Run v18.7.29 canonical runtime request-ledger integration
        run: python -m unittest -v tests.test_genesis_v18_7_29_linux_runtime_integration

      - name: Run v18.7.30 trust-boundary hardening tests
        run: python -m unittest -v tests.test_genesis_v18_7_30_trust_boundary_hardening

      - name: Re-run v18.7.27 review and reconciliation tests
        run: python -m unittest -v tests.test_genesis_v18_7_27_session_review_reconciliation

      - name: Re-run v18.7.26 controlled AI-link tests
        run: python -m unittest -v tests.test_genesis_v18_7_26_controlled_ai_link

      - name: Enforce v6.4 claim-boundary and failure-memory semantics
        run: |
          python - <<'PY'
          from pathlib import Path
          v28 = ' '.join(Path('genesis_v18_7_28_client_ledger_attestation.py').read_text(encoding='utf-8').split()).lower()
          v29 = ' '.join(Path('genesis_v18_7_29_portable_resource_lifetime.py').read_text(encoding='utf-8').split()).lower()
          v30 = ' '.join(Path('genesis_v18_7_30_trust_boundary_hardening.py').read_text(encoding='utf-8').split()).lower()
          required_v28 = [
              'janus does not infer that two identical actions are the same intent.',
              'not multi-host consensus.',
              'reference trust-boundary implementations',
              'verified review seats have zero world authority',
          ]
          required_v29 = [
              'does not close the connection',
              'failed v18.7.28 windows run remains evidence',
              'explicit sqlite connection close on every path',
          ]
          required_v30 = [
              'origin lineage must be attested too',
              'provider evidence must bind the authorization lineage',
              'first client settlement is immutable',
              'does not manufacture exactly-once execution',
              'settled replay is fail-closed at the client boundary',
          ]
          missing = (
              [x for x in required_v28 if x not in v28]
              + [x for x in required_v29 if x not in v29]
              + [x for x in required_v30 if x not in v30]
          )
          if missing:
              raise SystemExit('missing v6.4 semantics: ' + repr(missing))
          PY
