name: Janus Cosmos FractalGPT
on:
  push:
    paths:
      - 'experiments/janus_cosmos_fractalgpt/**'
      - '.github/workflows/janus-cosmos-fractalgpt.yml'
  pull_request:
    paths:
      - 'experiments/janus_cosmos_fractalgpt/**'
      - '.github/workflows/janus-cosmos-fractalgpt.yml'
  workflow_dispatch:

jobs:
  cosmos-pilot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install HST ingestion dependencies
        run: python -m pip install -r experiments/janus_cosmos_fractalgpt/requirements.txt
      - name: Ingest public HST/MAST cutouts
        run: python experiments/janus_cosmos_fractalgpt/ingest_hst.py experiments/janus_cosmos_fractalgpt/hst_targets.json hst-features.csv | tee janus-cosmos-ingest.json
      - name: Run blind FractalGPT spatial gate
        run: python experiments/janus_cosmos_fractalgpt/run_search.py hst-features.csv | tee janus-cosmos-receipt.json
      - name: Validate scientific guardrails
        run: python - <<'PY'
import json
r=json.load(open('janus-cosmos-receipt.json'))
assert r['semantic_analysis'] is False
assert r['nulls'] == 256
assert r['object_count'] >= 3
print('JANUS COSMOS REAL-HST PILOT PASS')
print(json.dumps(r, indent=2))
PY
      - name: Upload Cosmos receipts
        uses: actions/upload-artifact@v4
        with:
          name: janus-cosmos-hst-pilot
          path: |
            janus-cosmos-ingest.json
            janus-cosmos-receipt.json
            hst-features.csv
