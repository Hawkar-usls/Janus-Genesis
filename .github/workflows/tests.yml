name: Genesis Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install runtime dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Compile runtimes
        run: |
          python -m py_compile \
            janus_genesis.py \
            genesis_v17.py \
            genesis_v17_playable.py \
            genesis_v18_models.py \
            genesis_v18_memory.py \
            genesis_v18.py \
            genesis_v18_playable.py \
            genesis_v18_1.py \
            genesis_v18_1_playable.py \
            genesis_v18_2.py \
            genesis_v18_2_playable.py \
            genesis_v18_3.py \
            genesis_v18_3_playable.py \
            genesis_v18_4.py \
            genesis_v18_4_stories.py \
            genesis_v18_4_playable.py \
            genesis_v18_5_catalog.py \
            genesis_v18_5.py \
            genesis_v18_5_playable.py \
            genesis_v18_6_catalog.py \
            genesis_v18_6.py \
            genesis_v18_6_lexicon.py \
            genesis_v18_6_playable.py \
            genesis_v18_7_catalog.py \
            genesis_v18_7_compat.py \
            genesis_v18_7.py \
            genesis_v18_7_1.py \
            genesis_v18_7_2.py \
            genesis_v18_7_3.py \
            genesis_v18_7_4.py \
            genesis_v18_7_5.py \
            genesis_v18_7_5_repair.py \
            genesis_v18_7_6.py \
            genesis_v18_7_7.py \
            genesis_v18_7_7_voice_integrity.py \
            genesis_v18_7_8.py \
            genesis_v18_7_9.py \
            genesis_v18_7_9_persistence.py \
            genesis_v18_7_9_reactive_verifier.py \
            genesis_v18_7_10.py \
            genesis_v18_7_10_patch.py \
            genesis_v18_7_10_proofpack_completion.py \
            genesis_v18_7_10_rupture_voice.py \
            genesis_v18_7_10_mirror_integrity.py \
            genesis_v18_7_10_relationship_probe.py \
            genesis_v18_7_playable.py \
            genesis_v18_7_auth.py \
            genesis_v18_7_ai.py \
            genesis_v18_7_network.py \
            genesis_v18_7_portable.py \
            scripts/run_century_lived_audit.py \
            tools/genesis_api_server.py \
            tools/genesis_network_hub.py \
            play_genesis.py
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Run deterministic century lived audit
        env:
          AUDIT_COMMIT: ${{ github.event.pull_request.head.sha }}
          PYTHONPATH: ${{ github.workspace }}
        run: |
          COMMIT="${AUDIT_COMMIT:-$GITHUB_SHA}"
          python scripts/run_century_lived_audit.py \
            --output-dir artifacts/century-lived-audit \
            --git-commit "$COMMIT"
      - name: Upload century proofpack
        uses: actions/upload-artifact@v4
        with:
          name: genesis-century-lived-audit
          path: artifacts/century-lived-audit
          if-no-files-found: error
          retention-days: 30
