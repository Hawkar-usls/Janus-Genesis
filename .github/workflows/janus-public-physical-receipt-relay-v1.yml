name: JANUS Public Physical Receipt Relay v1

on:
  pull_request:
    paths:
      - 'tools/janus_public_physical_receipt_relay.py'
      - 'tests/test_janus_public_physical_receipt_relay_v1.py'
      - '.github/workflows/janus-public-physical-receipt-relay-v1.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  relay-contract:
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile
        run: python -m py_compile tools/janus_public_physical_receipt_relay.py
      - name: Unit tests
        run: python -m pytest -q tests/test_janus_public_physical_receipt_relay_v1.py
      - name: Privacy and claim sentinels
        shell: python
        run: |
          from pathlib import Path
          p = Path('tools/janus_public_physical_receipt_relay.py').read_text(encoding='utf-8')
          assert 'Unknown fields fail closed' in p
          assert 'reference_only' in p
          assert 'PUBLIC_PROJECTION_ONLY_NOT_PHYSICAL_EXECUTION_BY_ITSELF' in p
          assert '--publish' in p
          print('JANUS_PUBLIC_PHYSICAL_RECEIPT_RELAY=PASS')
