name: Apply universal chat entry

on:
  push:
    branches:
      - codex/genesis-v18-7-21-universal-chat-play

permissions:
  contents: write

jobs:
  patch-entry-surfaces:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: codex/genesis-v18-7-21-universal-chat-play

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Apply idempotent patch
        run: python tools/apply_universal_chat_entry_patch.py

      - name: Validate patched entry surfaces
        run: |
          python -m json.tool ai/GENESIS_UNIVERSAL_CHAT_ENTRY.json >/dev/null
          python -m unittest tests.test_genesis_v18_7_21_universal_chat_play -v
          git diff --check

      - name: Commit patched surfaces
        run: |
          if git diff --quiet; then
            echo "Universal chat entry already applied."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md AI_ENTRY.md llms.txt
          git commit -m "Expose universal chat play from public entry surfaces [universal-chat-entry-applied]"
          git push origin HEAD:codex/genesis-v18-7-21-universal-chat-play
