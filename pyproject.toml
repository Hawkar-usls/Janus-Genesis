[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "pla-janus-genesis"
version = "0.1.0"
description = "Physics-first transformation pipeline for existing FDM models."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Hawkar-usls" }]
dependencies = [
  "numpy>=1.26",
  "trimesh>=4.4",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "ruff>=0.5",
]

[project.scripts]
janus-genesis = "janus_genesis.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/janus_genesis"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100
